// --- Part B: Circle Gesture & Recognition ---
function getNoteTextInBox(box) {
  try {
    var rPaper = paper.getBoundingClientRect();
    var lines = notes.querySelectorAll('.ln');
    for (var i = 0; i < lines.length; i++) {
      var el = lines[i];
      var r = el.getBoundingClientRect();
      var elBox = {
        x: r.left - rPaper.left,
        y: r.top - rPaper.top + paper.scrollTop,
        w: r.width,
        h: r.height
      };
      var intersects = !(elBox.x > box.x + box.w ||
                         elBox.x + elBox.w < box.x ||
                         elBox.y > box.y + box.h ||
                         elBox.y + elBox.h < box.y);
      if (intersects) {
        var raw = (el.innerText || el.textContent || '').trim();
        var mathMatch = raw.match(/(?:∫|d\/dx)[^)]+\)?(?:\s*dx)?/);
        if (mathMatch) return mathMatch[0];
        if (raw && !raw.startsWith('✦') && !raw.startsWith('Step') && !raw.startsWith('Welcome') && !raw.startsWith('Follow') && !raw.startsWith('1.') && !raw.startsWith('2.') && !raw.startsWith('3.') && !raw.startsWith('✏')) {
          return raw;
        }
      }
    }
  } catch (e) {}
  return '';
}

function handleCircleGesture(pts) {
  // Closed loop gesture check
  var totalLen = 0;
  for (var i = 0; i < pts.length - 1; i++) {
    totalLen += Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
  }
  var p0 = pts[0], pEnd = pts[pts.length - 1];
  var endDist = Math.hypot(pEnd.x - p0.x, pEnd.y - p0.y);

  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (var j = 0; j < pts.length; j++) {
    var p = pts[j];
    if (p.x < minX) minX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.x > maxX) maxX = p.x;
    if (p.y > maxY) maxY = p.y;
  }
  var w = maxX - minX, h = maxY - minY;
  var closeThresh = Math.max(30, totalLen * 0.15);
  var isClosed = (endDist <= closeThresh) && (w >= 40) && (h >= 40);

  if (!isClosed) {
    toast('Draw a closed circle around the question');
    say('Draw a closed circle around the question');
    return;
  }

  // Bounding box with 12px padding
  var pad = 12;
  var box = {
    x: Math.max(0, minX - pad),
    y: Math.max(0, minY - pad),
    w: w + pad * 2,
    h: h + pad * 2
  };
  currentCircleBox = box;
  recordPerfMark('circle_finished');

  // Position violet ring around the circled area
  ring.style.cssText = 'left:' + box.x + 'px;top:' + box.y + 'px;width:' + box.w + 'px;height:' + box.h + 'px';
  ring.classList.add('on');

  // Find student strokes that intersect the box
  var strokes = getStrokes(cur);
  var insideStrokes = strokes.filter(function(s) {
    if (!s.points || !s.points.length) return false;
    for (var k = 0; k < s.points.length; k++) {
      var pt = s.points[k];
      if (pt.x >= box.x && pt.x <= box.x + box.w && pt.y >= box.y && pt.y <= box.y + box.h) {
        return true;
      }
    }
    return false;
  });

  if (insideStrokes.length === 0) {
    var circledText = getNoteTextInBox(box);
    if (circledText) {
      showConfirmPanel(circledText, box);
      return;
    }
    ring.classList.remove('on');
    currentCircleBox = null;
    toast('Nothing written inside that circle');
    say('Nothing written inside that circle');
    return;
  }

  // Render ONLY student strokes inside box onto offscreen canvas (white bg, black ink)
  var offW = Math.max(1, Math.round(box.w));
  var offH = Math.max(1, Math.round(box.h));
  var offCv = document.createElement('canvas');
  offCv.width = offW;
  offCv.height = offH;
  var offCtx = offCv.getContext('2d');

  offCtx.fillStyle = '#ffffff';
  offCtx.fillRect(0, 0, offW, offH);

  offCtx.save();
  offCtx.translate(-box.x, -box.y);
  for (var m = 0; m < insideStrokes.length; m++) {
    var orig = insideStrokes[m];
    var blackStroke = {
      color: '#000000',
      width: Math.max(3, orig.width || 2.4),
      points: orig.points
    };
    renderStroke(blackStroke, offCtx);
  }
  offCtx.restore();

  // Scale so longest side is at most RECOGNIZE_MAX_SIDE (768px)
  var longest = Math.max(offW, offH);
  var maxSide = window.RECOGNIZE_MAX_SIDE || 768;
  var scale = longest > maxSide ? (maxSide / longest) : 1;
  var finalCv = document.createElement('canvas');
  finalCv.width = Math.round(offW * scale);
  finalCv.height = Math.round(offH * scale);
  var finalCtx = finalCv.getContext('2d');
  finalCtx.fillStyle = '#ffffff';
  finalCtx.fillRect(0, 0, finalCv.width, finalCv.height);
  finalCtx.drawImage(offCv, 0, 0, finalCv.width, finalCv.height);

  var dataUrl = finalCv.toDataURL('image/png');
  recordPerfMark('crop_exported');
  var b64 = dataUrl.split(',')[1];

  sendRecognizeRequest(b64);
}

async function sendRecognizeRequest(b64) {
  setBusy(true);
  setStatusStage('Recognizing handwriting…');

  var controller = new AbortController();
  var timer = setTimeout(function() { controller.abort(); }, 60000);

  try {
    recordPerfMark('recognize_sent');
    var recHeaders = { 'Content-Type': 'application/json' };
    if (window.currentTraceId) recHeaders['X-Trace-Id'] = window.currentTraceId;
    var response = await fetch((API_BASE || '') + '/api/recognize', {
      method: 'POST',
      headers: recHeaders,
      body: JSON.stringify({
        image_base64: b64,
        media_type: 'image/png'
      }),
      signal: controller.signal
    });
    clearTimeout(timer);
    clearStatusStage();

    var stHeader = response.headers.get('Server-Timing');
    if (stHeader) {
      window.serverTimings.recognize = parseServerTiming(stHeader);
    }

    if (!response.ok) {
      var errData = await response.json().catch(function() { return {}; });
      var msg = errData.detail || ('Server status ' + response.status);
      toast('Recognition error: ' + msg);
      say('Could not read question automatically. Type it below.');
      showConfirmPanel('', 'Recognition error: ' + msg + '. Type question manually:');
      return;
    }

    var data = await response.json();
    recordPerfMark('recognize_received');
    if (data.readable === false) {
      say(data.note || 'Could not read handwriting. Type question below.');
      showConfirmPanel('', data.note || 'Handwriting not recognized. Type question manually:');
    } else {
      var recognizedQ = (data.question_text || data.latex || '').trim();
      startSpeculativeSolve(recognizedQ);
      say('Question recognized. Confirm or edit to solve.');
      showConfirmPanel(recognizedQ, data.note || '');
    }
  } catch (err) {
    clearTimeout(timer);
    clearStatusStage();
    var isTimeout = err.name === 'AbortError';
    var errMsg = isTimeout ? 'Recognition timed out (60s)' : 'Backend unreachable (' + err.message + ')';
    toast(errMsg);
    say(errMsg + '. Type question below.');
    showConfirmPanel('', errMsg + '. Please type question manually:');
  } finally {
    setBusy(false);
  }
}

// --- Hint Ladder State & Handler ---
var hintCache = {};

async function runHintLadder(questionText, box) {
  if (busy) return;
  hideConfirmPanel();

  // Hard Rule 4: Await font loading before text measurements or animations
  await ensureFontLoaded();

  if (!hintCache[questionText]) {
    setBusy(true);
    say('Finding hint…');

    var contextPages = [];
    var cited = null;
    var citedTitle = null;

    try {
      var retResp = await fetch((API_BASE || '') + '/api/retrieve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: questionText, threshold: 0.65, top_k: 2 })
      });
      if (retResp.ok) {
        var retData = await retResp.json();
        if (retData.matches && retData.matches.length > 0) {
          var top = retData.top_match || retData.matches[0];
          cited = top.page;
          citedTitle = top.title;
          contextPages = retData.matches.map(function(m) {
            return { page: m.page, snippet: m.title + ': ' + m.snippet };
          });
        }
      }
    } catch (e) {}

    try {
      var sResp = await fetch((API_BASE || '') + '/api/solve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: questionText, context: contextPages })
      });
      var sData = await sResp.json();
      if (!sData.verified || !sData.steps || sData.steps.length === 0) {
        toast('Cannot generate hint: verification failed');
        setBusy(false);
        return;
      }
      var nudgeMsg = citedTitle
        ? ('Recall ' + citedTitle.toLowerCase() + ' from Page ' + cited + ' to break down this expression.')
        : (sData.steps[0].narration || 'Start by identifying the outer and inner functions.');

      hintCache[questionText] = {
        question: questionText,
        steps: sData.steps,
        cited: (sData.cites_pages && sData.cites_pages[0]) || cited,
        nudge: nudgeMsg,
        box: box,
        level: 0
      };
    } catch (err) {
      toast('Hint error: ' + err.message);
      setBusy(false);
      return;
    } finally {
      setBusy(false);
    }
  }

  var hData = hintCache[questionText];
  hData.level = (hData.level || 0) + 1;

  if (hData.level === 1) {
    var cleanNudge = cleanNarrationText(hData.nudge);
    toast('Hint 1/3 (Nudge): ' + cleanNudge);
    say(cleanNudge);
    var mkHtml = '<div class="ln" style="font-weight:600;font-size:calc(var(--g)*1.15);color:var(--tx2);margin-bottom:calc(var(--g)*0.3);">' + escapeHtml(questionText) + '</div><div class="sp"></div><div class="ln" style="font-size:calc(var(--g)*1.2);color:var(--tx2);font-style:italic;">💡 Nudge: ' + escapeHtml(cleanNudge) + '</div>';
    if (hData.cited) {
      mkHtml += '<button class="mk show" id="mk" data-p="' + hData.cited + '">← your Page ' + hData.cited + ', again</button>';
    }
    notes.innerHTML = mkHtml;
  } else if (hData.level === 2) {
    stopVoiceAndAnimation();
    var hintSeqId = activeSolveSeqId;
    solveInProgressSeqId = hintSeqId;
    solveInProgressPage = cur;
    var firstStep = hData.steps[0];
    var cleanFirstStep = cleanNarrationText(firstStep.narration);
    toast('Hint 2/3 (Next step): ' + firstStep.write);
    notes.innerHTML = '';
    var qH = document.createElement('div');
    qH.className = 'ln q-hdr';
    qH.id = 'ai-question';
    qH.style.cssText = 'font-weight:600;font-size:calc(var(--g)*1.15);color:var(--tx2);margin-bottom:calc(var(--g)*0.3);';
    qH.textContent = questionText || '';
    notes.appendChild(qH);

    var spH = document.createElement('div');
    spH.className = 'sp';
    notes.appendChild(spH);

    var stepH = document.createElement('div');
    stepH.className = 'ln ai';
    stepH.id = 'step-0';
    stepH.dataset.stepIdx = 0;
    var lineObj = buildLineSvg(firstStep.write, { initialHidden: true });
    if (lineObj && lineObj.textEl) {
      lineObj.textEl.style.clipPath = 'inset(-16px 100% -16px 0)';
    }
    stepH.appendChild(lineObj.svg);
    notes.appendChild(stepH);

    var dur = getStepDuration(cleanFirstStep);
    var cloudAudioItem = null;
    if (TTS_MODE === 'cloud' && voice) {
      try {
        cloudAudioItem = await fetchTtsAudio(cleanFirstStep, null, 'first');
        if (cloudAudioItem && cloudAudioItem.duration > 0) {
          var rate = TTS_PLAYBACK_RATE || 1.05;
          dur = Math.round((cloudAudioItem.duration / rate) * 1000);
        }
      } catch (e) {}
    }
    var sPromise = speakNarration(cleanFirstStep, dur, hintSeqId, cloudAudioItem);
    var dPromise = lineObj ? animateLineWriting(lineObj, dur) : Promise.resolve();
    await Promise.all([sPromise, dPromise]);
    solveInProgressSeqId = null;
    solveInProgressPage = null;

    if (hData.cited) {
      var mkH = document.createElement('button');
      mkH.className = 'mk show';
      mkH.id = 'mk';
      mkH.dataset.p = hData.cited;
      mkH.textContent = '← your Page ' + hData.cited + ', again';
      notes.appendChild(mkH);
    }
  } else {
    toast('Hint 3/3: Full solution');
    hData.level = 0;
    runSolvePipeline(questionText, box);
  }
}

// --- Solve Pipeline with Retrieval & Verification ---
async function runSolvePipeline(questionText, box) {
  VoiceArbiter.unlock();
  stopVoiceAndAnimation();
  var currentSolveSeqId = activeSolveSeqId;
  solveInProgressSeqId = currentSolveSeqId;
  solveInProgressPage = cur;
  setBusy(true);
  recordPerfMark('solve_clicked');

  // Clear previous notes and render static problem prompt immediately
  notes.innerHTML = '';
  var qEl = document.createElement('div');
  qEl.className = 'ln q-hdr';
  qEl.id = 'ai-question';
  qEl.style.cssText = 'font-weight:600;font-size:calc(var(--g)*1.15);color:var(--tx2);margin-bottom:calc(var(--g)*0.3);';
  qEl.textContent = questionText || '';
  notes.appendChild(qEl);

  var spEl = document.createElement('div');
  spEl.className = 'sp';
  notes.appendChild(spEl);

  var solvingInd = document.createElement('div');
  solvingInd.id = 'ai-solving-indicator';
  solvingInd.className = 'ln';
  solvingInd.style.cssText = 'opacity:0.75;font-size:calc(var(--g)*0.95);color:var(--tx2);font-style:italic;margin-top:calc(var(--g)*0.2);';
  solvingInd.textContent = 'Solving with SymPy verification…';
  notes.appendChild(solvingInd);

  updateClearSolBtn();

  setStatusStage('Searching notebook memory…');

  // Step 1: Memory index retrieval via /api/retrieve
  var contextPages = [];
  var cited = null;
  try {
    var retResp = await fetch((API_BASE || '') + '/api/retrieve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query: questionText,
        threshold: 0.65,
        top_k: 2
      })
    });
    if (retResp.ok) {
      var retData = await retResp.json();
      if (retData.matches && retData.matches.length > 0) {
        var top = retData.top_match || retData.matches[0];
        cited = top.page;
        setStatusStage('Found ' + top.title.toLowerCase() + ' on Page ' + top.page);
        contextPages = retData.matches.map(function(m) {
          return {
            page: m.page,
            snippet: m.title + ': ' + m.snippet
          };
        });
      }
    }
  } catch (retErr) {
    console.warn('Memory retrieval skipped:', retErr);
  }

  if (currentSolveSeqId !== activeSolveSeqId) {
    solveInProgressSeqId = null;
    solveInProgressPage = null;
    return;
  }

  var data = null;

  try {
    // Optimization F: Consume speculative solve result if available and matched
    if (window.SPECULATIVE_SOLVE && speculativeSolvePromise && questionText === speculativeQuestionText) {
      setStatusStage('Verifying with SymPy…');
      try {
        data = await speculativeSolvePromise;
      } catch (specErr) {
        console.warn('Speculative solve failed or aborted, falling back:', specErr);
        data = null;
      }
      abortSpeculativeSolve();
    }

    if (!data) {
      if (!cited) {
        setStatusStage('Verifying with SymPy…');
      }

      // Step 2: Solve with SymPy verification
      recordPerfMark('solve_sent');
      var solHeaders = { 'Content-Type': 'application/json' };
      if (window.currentTraceId) solHeaders['X-Trace-Id'] = window.currentTraceId;
      var response = await fetch((API_BASE || '') + '/api/solve', {
        method: 'POST',
        headers: solHeaders,
        body: JSON.stringify({
          question: questionText,
          context: contextPages
        })
      });

      if (currentSolveSeqId !== activeSolveSeqId) {
        solveInProgressSeqId = null;
        solveInProgressPage = null;
        clearStatusStage();
        return;
      }

      var stSolHeader = response.headers.get('Server-Timing');
      if (stSolHeader) {
        window.serverTimings.solve = parseServerTiming(stSolHeader);
      }

      if (!response.ok) {
        var errJson = await response.json().catch(function() { return {}; });
        throw new Error(errJson.detail || ('Server status ' + response.status));
      }

      data = await response.json();
    }

  recordPerfMark('solve_received');

  var oldInd = document.getElementById('ai-solving-indicator');
  if (oldInd) oldInd.remove();

  if (!data.verified) {
    clearStatusStage();
    var failMsg = data.error || 'SymPy rejected answer';
    console.warn('[Solve Verification Failed]', failMsg, data);
    say('Verification check failed: ' + failMsg);
    toast('SymPy verification failed: ' + failMsg);
    showConfirmPanel(questionText, 'Verification failed: ' + failMsg + '. Adjust and retry:');
    await interruptibleWait(3000, currentSolveSeqId);
    $('#chip').classList.remove('on');
    return;
  }

  // Cited earlier page callback from verified solver response
  if (data.cites_pages && data.cites_pages.length > 0) {
    cited = data.cites_pages[0];
  }

  // Save AI output for the current page
  pageAiOutput[cur] = {
    question: questionText,
    steps: data.steps,
    cited: cited,
    box: box
  };
  savePersistedAiOutput();

  // Optimization E: Immediately prefetch ALL steps in batch with concurrency 3
  if (TTS_MODE === 'cloud' && voice && data.steps.length > 0) {
    setStatusStage("Preparing Ink's voice…");
    prefetchAllTtsSteps(data.steps, currentSolveSeqId, window.TTS_PREFETCH_CONCURRENCY || 3);
  }

    // Hard Rule 4: Wait for font before anything font-dependent runs (solution animation, text measurement)
    await ensureFontLoaded();
    if (currentSolveSeqId !== activeSolveSeqId) {
      solveInProgressSeqId = null;
      solveInProgressPage = null;
      return;
    }

    // Ensure prompt header exists and remove any stray steps
    if (!document.getElementById('ai-question')) {
      notes.innerHTML = '';
      var qElSync = document.createElement('div');
      qElSync.className = 'ln q-hdr';
      qElSync.id = 'ai-question';
      qElSync.style.cssText = 'font-weight:600;font-size:calc(var(--g)*1.15);color:var(--tx2);margin-bottom:calc(var(--g)*0.3);';
      qElSync.textContent = questionText || '';
      notes.appendChild(qElSync);

      var spElSync = document.createElement('div');
      spElSync.className = 'sp';
      notes.appendChild(spElSync);
      updateClearSolBtn();
    } else {
      var straySteps = notes.querySelectorAll('.ln.ai[id^="step-"], #mk');
      straySteps.forEach(function(el) { el.remove(); });
    }

    // Optimization: Prefetch all TTS steps concurrently as soon as solve is received
    if (TTS_MODE === 'cloud' && voice) {
      prefetchAllTtsSteps(data.steps, currentSolveSeqId);
    }

    // Animate each step with voice narration and real pen-stroke drawing:
    // Line i+1 is NEVER created in the DOM until line i finishes writing and its narration ends.
    for (var i = 0; i < data.steps.length; i++) {
      if (currentSolveSeqId !== activeSolveSeqId) {
        solveInProgressSeqId = null;
        solveInProgressPage = null;
        return;
      }

      var step = data.steps[i];
      var cleanText = cleanNarrationText(step.narration);
      var pos = (i === 0) ? 'first' : (i === data.steps.length - 1 ? 'last' : 'middle');
      var stepDuration = getStepDuration(cleanText);

      // Create step element and append to notes immediately so first stroke is visible without TTS latency
      var stepEl = document.createElement('div');
      stepEl.className = 'ln ai';
      stepEl.id = 'step-' + i;
      stepEl.dataset.stepIdx = i;

      var lineObj = buildLineSvg(step.write, { initialHidden: true });
      if (lineObj && lineObj.textEl) {
        lineObj.textEl.style.clipPath = 'inset(-16px 100% -16px 0)';
      }
      stepEl.appendChild(lineObj.svg);
      notes.appendChild(stepEl);
      if (i === 0) {
        clearStatusStage();
        recordPerfMark('first_step_created');
        recordPerfMark('first_step_visible');
      }

      recordPerfMark('step_' + i + '_audio_start');
      var speechPromise = speakNarration(cleanText, stepDuration, currentSolveSeqId, null, pos).then(function(res) {
        recordPerfMark('step_' + i + '_audio_end');
        return res;
      });
      var drawPromise = lineObj ? animateLineWriting(lineObj, stepDuration) : Promise.resolve();

      await Promise.all([speechPromise, drawPromise]);
      if (lineObj && lineObj.textEl) {
        lineObj.textEl.style.clipPath = 'none';
      }


      if (currentSolveSeqId !== activeSolveSeqId) {
        solveInProgressSeqId = null;
        solveInProgressPage = null;
        return;
      }

      if (i < data.steps.length - 1) {
        await interruptibleWait(400, currentSolveSeqId);
      }
    }

    if (currentSolveSeqId !== activeSolveSeqId) {
      solveInProgressSeqId = null;
      solveInProgressPage = null;
      return;
    }

    // Page 1 callback link appears after all solution steps are written
    if (cited) {
      var mkEl = document.createElement('button');
      mkEl.className = 'mk show';
      mkEl.id = 'mk';
      mkEl.dataset.p = cited;
      mkEl.textContent = '← your Page ' + cited + ', again';
      notes.appendChild(mkEl);
    }

    say('Verified symbolically with SymPy');
    await interruptibleWait(2200, currentSolveSeqId);

  } catch (err) {
    var oldInd = document.getElementById('ai-solving-indicator');
    if (oldInd) oldInd.remove();
    if (currentSolveSeqId === activeSolveSeqId) {
      console.error('Solve error:', err);
      toast('API error: ' + err.message);
      say('Error solving problem: ' + err.message);
      showConfirmPanel(questionText, 'Error solving: ' + err.message);
      await interruptibleWait(2000, currentSolveSeqId);
    }
  } finally {
    clearStatusStage();
    if (currentSolveSeqId === activeSolveSeqId) {
      $('#chip').classList.remove('on');
      setBusy(false);
      solveInProgressSeqId = null;
      solveInProgressPage = null;
      if (typeof VoiceArbiter !== 'undefined' && VoiceArbiter.stop) {
        VoiceArbiter.stop();
      }
    }
  }
}
window.runSolvePipeline = runSolvePipeline;
window.render = render;
window.go = go;

// Solve Button Click in Header
$('#solve').onclick = function() {
  VoiceArbiter.unlock();
  if (busy) return;
  if (confirmPanel.style.display === 'flex') {
    $('#cp-solve').click();
    return;
  }
  setTool('circle');
  toast('Circle a question on the page');
  say('Circle a question on the page to solve');
};

// Hint Button Click in Header
$('#hint-btn').onclick = function() {
  if (busy) return;
  if (confirmPanel.style.display === 'flex') {
    $('#cp-hint').click();
    return;
  }
  setTool('circle');
  toast('Circle a question for hints');
  say('Circle a question for hints');
};

// Scripted Demo Fallback (callable via console: window.runScriptedDemo())
window.runScriptedDemo = async function() {
  if (busy) return;
  go(6);
  await wait(300);
  runSolvePipeline('∫ sin(x) dx', null);
};

if (innerWidth <= 820) app.classList.remove('open');
ensureFontLoaded().then(function() {
  render();
  size();
});
