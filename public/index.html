<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InkMentor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Caveat';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('/fonts/Caveat-Regular.ttf?v=2') format('truetype'),
       url('fonts/Caveat-Regular.ttf?v=2') format('truetype');
}
@font-face {
  font-family: 'Caveat';
  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: url('/fonts/Caveat-Regular.ttf?v=2') format('truetype'),
       url('fonts/Caveat-Regular.ttf?v=2') format('truetype');
}
@font-face {
  font-family: 'Caveat';
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url('/fonts/Caveat-Regular.ttf?v=2') format('truetype'),
       url('fonts/Caveat-Regular.ttf?v=2') format('truetype');
}
@font-face {
  font-family: 'Caveat';
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url('/fonts/Caveat-Regular.ttf?v=2') format('truetype'),
       url('fonts/Caveat-Regular.ttf?v=2') format('truetype');
}
:root{--bg:#f2f2f7;--glass:rgba(255,255,255,.66);--gb:rgba(255,255,255,.8);--line:rgba(0,0,0,.07);--tx:#1c1c1e;--tx2:#6e6e73;--ac:#6b4ef0;--sh:0 12px 44px rgba(0,0,0,.10);--g:32px;--ai-font:'Caveat','Reenie Beanie',cursive;--ai-font-size:calc(var(--g)*1.45);--ai-line-height:calc(var(--g)*1.65);--ai-glow:drop-shadow(0 0 3.5px rgba(255,94,126,0.28));--ai-dot-size:8px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0f;--glass:rgba(32,32,40,.62);--gb:rgba(255,255,255,.09);--line:rgba(255,255,255,.09);--tx:#f5f5f7;--tx2:#9a9aa3;--ac:#a99bff;--sh:0 12px 44px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg:#0a0a0f;--glass:rgba(32,32,40,.62);--gb:rgba(255,255,255,.09);--line:rgba(255,255,255,.09);--tx:#f5f5f7;--tx2:#9a9aa3;--ac:#a99bff;--sh:0 12px 44px rgba(0,0,0,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.4 -apple-system,'Inter',system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:fixed;inset:0;display:flex;gap:12px;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.glass{background:var(--glass);backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%);border:1px solid var(--gb);box-shadow:var(--sh)}
#sb{width:268px;flex:none;border-radius:24px;padding:18px 14px 14px;display:flex;flex-direction:column;gap:14px;transition:width .35s cubic-bezier(.2,.8,.2,1),opacity .25s,padding .35s,margin .35s;overflow:hidden}
#app.hide #sb{width:0;padding:0;opacity:0;border-width:0;margin-right:-12px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#FFB347,#FF5E7E);display:grid;place-items:center;color:#2a0f14}
.logo .i{width:16px;height:16px}
.brand b{font:400 26px 'Instrument Serif',serif;letter-spacing:-.3px}
.brand i{font-style:italic;color:var(--ac)}
.sr{display:flex;align-items:center;gap:8px;padding:0 12px;height:36px;border-radius:12px;background:var(--line);color:var(--tx2)}
.sr input{flex:1;min-width:0;border:0;background:none;color:var(--tx);font:inherit;outline:none}
.lb{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--tx2);padding:0 8px}
#pl{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1;margin:-4px -4px 0;padding:4px}
.pi{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;text-align:left;transition:background .2s;white-space:nowrap}
.pi:hover{background:var(--line)}
.pi.on{background:color-mix(in srgb,var(--ac) 15%,transparent)}
.pi b{display:block;font-weight:600;font-size:14px}.pi small{color:var(--tx2);font-size:12px}
.pi.on b{color:var(--ac)}
.th{width:36px;height:46px;border-radius:7px;background:#fff;background-image:linear-gradient(rgba(0,0,0,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.2) 1px,transparent 1px);background-size:9px 9px;box-shadow:0 0 0 1px var(--line),0 3px 8px rgba(0,0,0,.08);flex:none}
#add-page{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;color:var(--tx);font-weight:600;font-size:13px;background:var(--line);white-space:nowrap;transition:background .2s}
#add-page:hover{filter:brightness(1.08)}
.mem{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--line);white-space:nowrap}
.mem b{display:block;font-weight:600}.mem small{color:var(--tx2);font-size:12px}
.mem i{width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 0 var(--ac);animation:pl 2.4s infinite}
@keyframes pl{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.st{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;color:var(--tx2);white-space:nowrap}.st:hover{background:var(--line)}
#mn{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;position:relative}
#hd{display:flex;align-items:center;gap:12px;min-height:52px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--tx);flex:none;transition:background .2s}
.ib:hover{background:var(--line)}
.ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl b{font-weight:600}.ttl span{color:var(--tx2);margin-left:8px}
.tb{display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tb::-webkit-scrollbar{display:none}
.tb .ib{width:38px;height:38px}
.tb .ib.on{background:var(--line);color:var(--ac)}
.dv{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
.dot{width:22px;height:22px;border-radius:50%;margin:0 3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);transition:transform .15s}
.dot.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
.sv{display:flex;align-items:center;gap:6px;height:38px;padding:0 16px 0 12px;margin-left:4px;border-radius:999px;background:linear-gradient(90deg,#FFB347,#FF5E7E);color:#2a0f14;font-weight:600;flex:none;transition:transform .15s,filter .2s}
.sv:hover{filter:brightness(1.06)}.sv:active{transform:scale(.97)}
.sv:disabled,.ib:disabled{opacity:0.4;cursor:not-allowed;pointer-events:none}
#paper{flex:1;position:relative;border-radius:24px;overflow-y:auto;overflow-x:hidden;background:#fff;background-image:linear-gradient(rgba(0,0,0,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.2) 1px,transparent 1px);background-size:var(--g) var(--g);background-attachment:local;box-shadow:var(--sh),0 0 0 1px var(--line);color:#0b0b14;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,0.2) transparent}
#paper::-webkit-scrollbar{width:8px}
#paper::-webkit-scrollbar-track{background:transparent;margin:12px 0}
#paper::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.18);border-radius:8px}
#paper::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.32)}
#cv{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;z-index:1}
#ov{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;pointer-events:none;z-index:2}
#notes{position:relative;width:100%;min-height:100%;padding:calc(var(--g)*1.8) var(--g) calc(var(--g)*8);display:flex;flex-direction:column;align-items:flex-start;pointer-events:none;font:400 var(--ai-font-size)/var(--ai-line-height) var(--ai-font);font-family:var(--ai-font);z-index:3}
.ln{max-width:100%;font-family:var(--ai-font);user-select:none;-webkit-user-select:none;transition:background .15s}
.ln[contenteditable="true"]{user-select:text;-webkit-user-select:text;cursor:text}
.sp{height:calc(var(--g)*0.45);flex:none}
.nb-line{color:#0f172a !important;font-size:calc(var(--g)*0.86);line-height:1.32;font-weight:400}
.nb-title{line-height:1.2;font-size:calc(var(--g)*1.75) !important}
.nb-section{font-size:calc(var(--g)*0.96) !important;font-weight:700 !important;color:#1e1b4b !important;margin-top:calc(var(--g)*0.2)}
.ai{margin-left:var(--g);color:#FF5E7E;text-shadow:0 0 18px rgba(255,94,126,.35)}
.ai-line-container{display:inline-block;position:relative;max-width:100%;vertical-align:middle}
.ai-reenie-line{display:inline-block;font-family:var(--ai-font) !important;font-size:var(--ai-font-size);line-height:var(--ai-line-height);white-space:nowrap;vertical-align:middle;background:linear-gradient(90deg,#FFA23A 0%,#FF5E7E 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:var(--ai-glow)}
.ai-pen-tip-dot{position:absolute;display:none;width:var(--ai-dot-size);height:var(--ai-dot-size);border-radius:50%;background:#FFA23A;border:1.5px solid #FF5E7E;box-shadow:0 0 8px #FFA23A, 0 0 14px rgba(255,94,126,0.6);pointer-events:none;z-index:5;transform:translate(-50%,-50%)}
.math-line-svg{display:block;overflow:visible}
.math-stroke{fill:none;stroke:url(#ai-ink-grad);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(255,94,126,0.35))}
.pen-tip{fill:#FFA23A;stroke:#FF5E7E;stroke-width:1.5;filter:drop-shadow(0 0 6px #FFA23A);pointer-events:none}
.mk{pointer-events:auto;margin:calc(var(--g)*.5) 0 0 calc(var(--g)*1.5);font:inherit;color:#e8446a;opacity:0;transform:translateX(-8px);transition:.5s;visibility:hidden;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.mk.show{opacity:1;transform:none;visibility:visible}
.math-sup{font-size:.58em;vertical-align:.44em;line-height:0;display:inline-block;font-weight:400;margin-right:.16em;-webkit-text-fill-color:transparent}
.math-svg{display:inline-block;vertical-align:-0.30em;height:1.50em;width:auto;overflow:visible;fill:none;stroke:url(#ai-ink-grad);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;-webkit-text-fill-color:initial;filter:var(--ai-glow)}
.ai .math-svg{stroke:url(#ai-ink-grad)}
.math-diff{display:inline-block;margin-left:.24em}
.math-delim{display:inline-block;font-size:0.94em;vertical-align:0.02em}
#ring{position:absolute;border:2.5px solid var(--ac);border-radius:18px;opacity:0;transform:scale(1.04);transition:.4s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 24px color-mix(in srgb,var(--ac) 45%,transparent);pointer-events:none;z-index:4}
#ring.on{opacity:1;transform:none}
#confirm-panel{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:min(460px,calc(100% - 32px));z-index:50;padding:16px;border-radius:20px;display:none;flex-direction:column;gap:10px;box-shadow:var(--sh)}
.cp-hdr{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em}
.cp-input{width:100%;border:1px solid var(--line);background:var(--line);border-radius:12px;padding:10px 14px;color:var(--tx);font:500 14px -apple-system,'Inter',sans-serif;outline:none;transition:border-color .2s}
.cp-input:focus{border-color:var(--ac)}
.cp-note{font-size:12px;color:#FF5E7E;line-height:1.35}
.cp-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:2px}
.cp-btn{border-radius:999px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:transform .12s,filter .2s}
.cp-btn:active{transform:scale(.97)}
.cp-btn.cancel{border:1px solid var(--line);color:var(--tx2);background:transparent}
.cp-btn.cancel:hover{background:var(--line);color:var(--tx)}
.cp-btn.solve{background:linear-gradient(90deg,#FFB347,#FF5E7E);color:#2a0f14}
.cp-btn.solve:hover{filter:brightness(1.06)}
#chip{position:absolute;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:999px;transition:.4s cubic-bezier(.2,.8,.2,1);white-space:nowrap;max-width:calc(100% - 24px);color:var(--tx);z-index:50}
#chip.on{opacity:1;transform:translate(-50%,0)}
.wv{display:flex;gap:3px;align-items:center;height:20px}
.wv i{width:3px;border-radius:2px;background:linear-gradient(#FFB347,#FF5E7E);height:5px;animation:wb .7s ease-in-out infinite alternate}
.wv i:nth-child(2){animation-delay:.15s}.wv i:nth-child(3){animation-delay:.3s}.wv i:nth-child(4){animation-delay:.1s}.wv i:nth-child(5){animation-delay:.25s}
@keyframes wb{to{height:20px}}
@keyframes ai-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
#server-wakeup-toast{position:fixed;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;padding:8px 18px;border-radius:999px;font-size:13px;font-weight:500;color:#FFA23A;border:1px solid rgba(255,162,58,.35);background:rgba(26,26,36,.92);box-shadow:0 4px 16px rgba(0,0,0,.4);backdrop-filter:blur(8px);display:none;align-items:center;gap:8px;z-index:9999;transition:all .3s ease;pointer-events:none}
#server-wakeup-toast.show{display:flex;opacity:1;transform:translate(-50%,0)}
#toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;padding:10px 18px;border-radius:999px;transition:.35s;z-index:30;pointer-events:none;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
#scrim{display:none}
@media(max-width:820px){
:root{--g:28px}
#app{padding:8px;gap:8px;padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
#sb{position:fixed;left:8px;top:calc(8px + env(safe-area-inset-top,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:40;width:280px;transform:translateX(-110%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
#app.hide #sb{width:280px;padding:18px 14px 14px;opacity:1;border-width:1px;margin:0}
#app.open #sb{transform:none}
#app.open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:39}
.ttl{display:none}#hd{justify-content:space-between}
.tb{margin-left:auto}
}
/* --- Motion Graphics Loading Screen --- */
#loader-screen {
  position: fixed;
  inset: 0;
  z-index: 100000;
  background: #08080d;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-family: -apple-system, 'Inter', system-ui, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  transition: opacity 1.8s cubic-bezier(0.16, 1, 0.3, 1), transform 1.8s cubic-bezier(0.16, 1, 0.3, 1), filter 1.8s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: opacity, transform, filter;
}
#loader-screen.unveil {
  opacity: 0;
  transform: scale(1.06);
  filter: blur(28px);
  pointer-events: none;
}
.loader-bg-glow {
  position: absolute;
  width: 580px;
  height: 580px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(124, 92, 255, 0.24) 0%, rgba(255, 94, 126, 0.18) 45%, transparent 70%);
  filter: blur(52px);
  pointer-events: none;
  animation: loader-glow-pulse 4s ease-in-out infinite alternate;
}
@keyframes loader-glow-pulse {
  0% { transform: scale(0.92) translate(-10px, -10px); opacity: 0.75; }
  100% { transform: scale(1.18) translate(10px, 10px); opacity: 1; }
}
.loader-stage {
  position: relative;
  width: min(600px, 92vw);
  height: calc(min(600px, 92vw) * 0.367);
  display: flex;
  align-items: center;
  justify-content: center;
}
.ink-trail-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.trail-path {
  fill: none;
  stroke: url(#loader-grad);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 10px rgba(255, 94, 126, 0.7));
}
.needle-glow-dot {
  fill: #FFA23A;
  filter: drop-shadow(0 0 12px #FFA23A) drop-shadow(0 0 20px #FF5E7E);
  transition: opacity 0.3s ease;
}
.loader-brand {
  font: 400 42px 'Instrument Serif', Georgia, serif;
  letter-spacing: -0.5px;
  color: #ffffff;
  margin-top: 14px;
  display: flex;
  align-items: center;
  gap: 2px;
}
.loader-brand span {
  font-style: italic;
  background: linear-gradient(135deg, #FFB347, #FF5E7E, #7C5CFF);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-left: 2px;
}
.loader-tagline {
  font-size: 16px;
  font-weight: 400;
  color: #94a3b8;
  margin-top: 8px;
  letter-spacing: 0.02em;
  text-align: center;
}
.loader-tagline b {
  font-weight: 600;
  background: linear-gradient(90deg, #FFB347, #FF5E7E);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.loader-bar-wrap {
  width: 220px;
  height: 2.5px;
  background: rgba(255,255,255,0.08);
  border-radius: 999px;
  margin-top: 26px;
  overflow: hidden;
  position: relative;
}
.loader-bar-fill {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #FFB347, #FF5E7E, #7C5CFF);
  border-radius: 999px;
}
.loader-hint {
  font-size: 11px;
  color: rgba(255,255,255,0.25);
  margin-top: 14px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
#app {
  transition: opacity 1.8s cubic-bezier(0.16, 1, 0.3, 1), filter 1.8s cubic-bezier(0.16, 1, 0.3, 1), transform 1.8s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: opacity, filter, transform;
}
body.app-loading #app {
  opacity: 0;
  filter: blur(16px);
  transform: scale(0.98);
  pointer-events: none;
}
</style>
</head>

<symbol id="sea" viewBox="0 0 24 24"><path d="M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-4.3-4.3"/></symbol>

<script>
// --- Motion Graphics App Loader ---
(function initAppLoader() {
  var loader = document.getElementById('loader-screen');
  if (!loader) return;
  document.body.classList.add('app-loading');

  var curve = document.getElementById('loader-curve');
  var mover = document.getElementById('loader-nib-mover');
  var dot = document.getElementById('loader-needle-dot');
  var bar = document.getElementById('loader-bar-fill');

  var totalLength = 600;
  try {
    if (curve && typeof curve.getTotalLength === 'function') {
      totalLength = curve.getTotalLength() || 600;
    }
  } catch (e) {
    totalLength = 600;
  }

  if (curve) {
    curve.style.strokeDasharray = totalLength + ' ' + totalLength;
    curve.style.strokeDashoffset = totalLength;
  }

  var TOTAL_TIME = 5500;  // 5.5 seconds total screen duration
  var DRAW_TIME = 4000;   // 4.0 seconds drawing
  var LIFT_TIME = 700;    // 0.7 seconds graceful nib lift
  var startTime = null;
  var dismissed = false;
  var rafId = null;

  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function dismissLoader() {
    if (dismissed) return;
    dismissed = true;
    if (rafId) cancelAnimationFrame(rafId);
    loader.classList.add('unveil');
    document.body.classList.remove('app-loading');
    setTimeout(function() {
      if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
      if (typeof size === 'function') size();
    }, 1950);
  }

  loader.addEventListener('click', dismissLoader);
  window.addEventListener('keydown', function(e) {
    if (!dismissed && (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ')) {
      dismissLoader();
    }
  }, { once: true });

  function step(timestamp) {
    if (dismissed) return;
    if (!startTime) startTime = timestamp;
    var elapsed = timestamp - startTime;

    // 1. Progress Bar filling smoothly over 5.5s
    if (bar) {
      var pct = Math.min(100, (elapsed / TOTAL_TIME) * 100);
      bar.style.width = pct.toFixed(1) + '%';
    }

    // 2. Calligraphic Pen Animation
    if (curve && mover && dot) {
      if (elapsed <= DRAW_TIME) {
        var t = elapsed / DRAW_TIME;
        var p = easeInOutCubic(t);
        var dist = p * totalLength;
        var pt = curve.getPointAtLength(dist);

        // Organic dynamic tilt: pen rests at ~34deg slant and naturally flexes with curve tangent
        var delta = 3;
        var p1 = curve.getPointAtLength(Math.max(0, dist - delta));
        var p2 = curve.getPointAtLength(Math.min(totalLength, dist + delta));
        var dx = p2.x - p1.x;
        var dy = p2.y - p1.y;
        var tangentDeg = Math.atan2(dy, dx) * 180 / Math.PI;
        var tilt = 34 + (tangentDeg * 0.18);

        curve.style.strokeDashoffset = (totalLength - dist).toFixed(2);
        mover.setAttribute('transform', 'translate(' + pt.x.toFixed(2) + ',' + pt.y.toFixed(2) + ') rotate(' + tilt.toFixed(2) + ')');
        dot.setAttribute('cx', pt.x.toFixed(2));
        dot.setAttribute('cy', pt.y.toFixed(2));
        dot.style.opacity = '1';
      } else if (elapsed <= DRAW_TIME + LIFT_TIME) {
        // Nib lifts off the page gracefully
        curve.style.strokeDashoffset = '0';
        var endPt = curve.getPointAtLength(totalLength);
        var liftProg = (elapsed - DRAW_TIME) / LIFT_TIME;
        var liftEase = 1 - Math.pow(1 - liftProg, 3);
        var liftY = endPt.y - (liftEase * 20);
        var liftX = endPt.x + (liftEase * 10);
        var liftTilt = 34 - (liftEase * 6);

        mover.setAttribute('transform', 'translate(' + liftX.toFixed(2) + ',' + liftY.toFixed(2) + ') rotate(' + liftTilt.toFixed(2) + ')');
        dot.setAttribute('cx', endPt.x.toFixed(2));
        dot.setAttribute('cy', endPt.y.toFixed(2));
        dot.style.opacity = (1 - (liftProg * 0.35)).toFixed(2);
      } else {
        // Holding in poised glowing stillness until transition
        curve.style.strokeDashoffset = '0';
      }
    }

    if (elapsed >= TOTAL_TIME) {
      dismissLoader();
    } else {
      rafId = requestAnimationFrame(step);
    }
  }

  rafId = requestAnimationFrame(step);
})();

// --- Serverless Wakeup Health Check ---
(function initServerWakeupCheck() {
  var backoffMs = 1000;
  var maxBackoff = 8000;
  var attempts = 0;
  function getToast() { return document.getElementById('server-wakeup-toast'); }
  function showNotice(msg) {
    var el = getToast();
    if (el) {
      if (msg) {
        var label = el.querySelector('span:last-child');
        if (label) label.textContent = msg;
      }
      el.classList.add('show');
    }
  }
  function hideNotice() {
    var el = getToast();
    if (el) el.classList.remove('show');
  }

  async function checkHealth() {
    attempts++;
    var timer = setTimeout(function() {
      showNotice('Waking up the server…');
    }, 2000);
    try {
      var res = await fetch((window.API_BASE || '') + '/api/health');
      clearTimeout(timer);
      if (res.ok) {
        hideNotice();
      } else {
        var errDetail = '';
        try {
          var data = await res.json();
          errDetail = data.detail || data.message || data.error || '';
        } catch (_) {}
        console.warn('[Serverless Wakeup] /api/health returned HTTP ' + res.status + (errDetail ? ' (' + errDetail + ')' : ''));
        if (attempts >= 4) {
          var extra = errDetail ? ' [' + errDetail + ']' : '';
          showNotice('Server starting up (attempt ' + attempts + ')' + extra + '… Check Vercel logs if delayed');
        } else {
          showNotice('Waking up the server…');
        }
        retry();
      }
    } catch (e) {
      clearTimeout(timer);
      console.warn('[Serverless Wakeup] Health fetch failed:', e);
      if (attempts >= 4) {
        showNotice('Server starting up (attempt ' + attempts + ')… Check Vercel logs if delayed');
      } else {
        showNotice('Waking up the server…');
      }
      retry();
    }
  }

  function retry() {
    setTimeout(function() {
      backoffMs = Math.min(backoffMs * 1.5, maxBackoff);
      checkHealth();
    }, backoffMs);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', checkHealth);
  } else {
    checkHealth();
  }
})();

function parseServerTiming(header) {
  if (!header) return {};
  var result = {};
  var parts = header.split(',');
  parts.forEach(function(part) {
    var segs = part.trim().split(';');
    var name = segs[0].trim();
    var dur = null;
    for (var i = 1; i < segs.length; i++) {
      var kv = segs[i].trim().split('=');
      if (kv[0] === 'dur' && kv[1]) {
        dur = parseFloat(kv[1]);
      }
    }
    result[name] = dur !== null ? dur : true;
  });
  return result;
}

function recordPerfMark(name, extra) {
  var now = performance.now();
  if (name === 'circle_finished') {
    if (!window.currentTraceId) {
      window.currentTraceId = 'trace_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    }
    window.perfMarks = {
      trace_id: window.currentTraceId,
      circle_finished: now,
      crop_exported: 0,
      recognize_sent: 0,
      recognize_received: 0,
      confirm_shown: 0,
      solve_clicked: 0,
      solve_sent: 0,
      solve_received: 0,
      first_step_created: 0,
      first_stroke_painted: 0,
      first_audio_started: 0,
      step_audio: {}
    };
    window.serverTimings = {};
    window.perfMarksReported = false;
    return;
  }
  if (!window.perfMarks) {
    window.currentTraceId = 'trace_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    window.perfMarks = {
      trace_id: window.currentTraceId,
      step_audio: {}
    };
  }
  if (name.startsWith('step_') && (name.endsWith('_audio_start') || name.endsWith('_audio_end'))) {
    window.perfMarks[name] = now;
  } else if (!window.perfMarks[name]) {
    window.perfMarks[name] = now;
  }
  if (extra) {
    if (!window.perfMarks.extra) window.perfMarks.extra = {};
    window.perfMarks.extra[name] = extra;
  }
  if ((name === 'first_stroke_painted' || name === 'step_0_audio_start' || name === 'first_step_visible') && window.perfMarks && window.perfMarks.solve_received) {
    reportRunTimings();
  }
}
window.recordPerfMark = recordPerfMark;

function reportRunTimings() {
  if (window.perfMarksReported) return;
  var m = window.perfMarks;
  if (!m || !m.solve_clicked || !m.solve_received || (!m.first_stroke_painted && !m.first_step_visible)) return;
  window.perfMarksReported = true;

  var baseTime = m.circle_finished || m.solve_clicked;
  var table = [];

  function addStage(name, startMs, endMs, details) {
    if (startMs && endMs && endMs >= startMs) {
      table.push({
        Stage: name,
        'Offset (ms)': +(startMs - baseTime).toFixed(1),
        'Duration (ms)': +(endMs - startMs).toFixed(1),
        Details: details || ''
      });
    }
  }

  // 1. Circle & Recognition
  addStage('1. Circle Finished to Crop Exported', m.circle_finished, m.crop_exported);
  addStage('2. Crop Exported to Recognize Sent', m.crop_exported, m.recognize_sent);
  var recDetails = '';
  if (window.serverTimings && window.serverTimings.recognize) {
    var stRec = window.serverTimings.recognize;
    recDetails = 'Server: decode=' + (stRec.decode || 0) + 'ms, llm=' + (stRec.llm || 0) + 'ms';
  }
  addStage('3. Recognize Network (Sent -> Received)', m.recognize_sent, m.recognize_received, recDetails);
  addStage('4. Recognize Received to Confirm Shown', m.recognize_received, m.confirm_shown);

  // 2. Solve Request & Symbolic Verification
  addStage('5. Confirm Shown to Solve Clicked', m.confirm_shown, m.solve_clicked, 'Student review/pause');
  addStage('6. Solve Clicked to Solve Sent', m.solve_clicked, m.solve_sent);
  var solveDetails = '';
  if (window.serverTimings && window.serverTimings.solve) {
    var stSol = window.serverTimings.solve;
    solveDetails = 'Server: decode=' + (stSol.decode || 0) + 'ms, llm=' + (stSol.llm || 0) + 'ms, sympy=' + (stSol.sympy || 0) + 'ms';
  }
  addStage('7. Solve Network (Sent -> Received)', m.solve_sent, m.solve_received, solveDetails);

  // 3. Preparation & First Render
  addStage('8. Solve Received to First Step Created', m.solve_received, m.first_step_created);
  addStage('9. First Step Created to First Stroke Painted', m.first_step_created, m.first_stroke_painted);

  }

  if (m.solve_clicked && m.first_stroke_painted) {
    table.push({
      Stage: '*** TOTAL: Solve Clicked to First Stroke ***',
      'Offset (ms)': +(m.solve_clicked - baseTime).toFixed(1),
      'Duration (ms)': +(m.first_stroke_painted - m.solve_clicked).toFixed(1),
      Details: 'Key student wait metric'
    });
  }
  if (m.circle_finished && m.first_stroke_painted) {
    table.push({
      Stage: '*** TOTAL: Circle to First Stroke ***',
      'Offset (ms)': 0,
      'Duration (ms)': +(m.first_stroke_painted - m.circle_finished).toFixed(1),
      Details: 'Complete interactive lifecycle'
    });
  }

  try {
    console.log('%c[InkMentor Waterfall Trace: ' + (m.trace_id || 'unknown') + ']', 'color: #7c3aed; font-weight: bold; font-size: 13px;');
    console.table(table);
  } catch (e) {}

  window.lastWaterfall = {
    trace_id: m.trace_id,
    marks: Object.assign({}, m),
    table: table,
    server: Object.assign({}, window.serverTimings)
  };
}

var fontLoadedState = false;
var fontLoadPromise = null;

function ensureFontLoaded() {
  if (fontLoadedState) return Promise.resolve(true);
  if (fontLoadPromise) return fontLoadPromise;

  applyActiveFontConfig();
  var fam = (window.AI_FONT === 'caveat') ? 'Caveat' : 'Reenie Beanie';
  var testSpec = '46px "' + fam + '"';

  if (!document.fonts || !document.fonts.load) {
    fontLoadedState = true;
    return Promise.resolve(false);
  }

  fontLoadPromise = Promise.all([
    document.fonts.load(testSpec).catch(function(e) {
      console.warn('document.fonts.load fallback:', e);
      return [];
    }),
    (document.fonts.ready || Promise.resolve()).catch(function(e) {
      console.warn('document.fonts.ready fallback:', e);
      return null;
    })
  ]).then(function() {
    fontLoadedState = true;
    return true;
  }).catch(function(err) {
    console.warn('Font load error fallback:', err);
    fontLoadedState = true;
    return false;
  });

  return fontLoadPromise;
}
window.ensureFontLoaded = ensureFontLoaded;

window.setFont = function(fontName) {
  window.AI_FONT = fontName;
  fontLoadedState = false;
  fontLoadPromise = null;
  applyActiveFontConfig();
  return ensureFontLoaded().then(function() {
    if (typeof render === 'function') render();
    return true;
  });
};

  undoHistory[cur] = undoHistory[cur] || [];

}

function cleanNarrationText(t) {
  if (!t) return '';
  var s = String(t).trim();
  s = s.replace(/^(?:writing\s+)?step\s*\d+(?:\s*(?:of|\/)\s*\d+)?(?:\s*[:.·\-–—]\s*|\s+)/i, '');
  s = s.replace(/^(?:first|second|third|fourth|fifth|sixth)\s+step(?:\s*[:.·\-–—]\s*|\s+)/i, '');

}

function getStepDuration(narrationText) {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    return 0;
  }
  var clean = cleanNarrationText(narrationText);
  var words = clean.split(/\s+/).filter(Boolean).length;
  // Speech pacing estimate: ~2.5 words per second = 400ms per word.
  // Paced with speech: floor at 2000ms, ceiling at 8000ms.
  return Math.max(2000, Math.min(8000, Math.round(words * 400)));
}

function splitPathIntoStrokes(d) {

function animateHersheyStrokeLine(lineObj, duration) {
  return new Promise(function(resolve) {

      if (lineObj && lineObj.penTip) lineObj.penTip.style.display = 'none';
      resolve();
      return;
    }

    var items = lineObj.strokeItems;
    var penTip = lineObj.penTip;
    var isReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (duration <= 0 || isReduced) {
      for (var i = 0; i < items.length; i++) {
        items[i].path.style.strokeDashoffset = '0';
      }
      penTip.style.display = 'none';
      resolve();
      return;
    }

    var lengths = [];
    var totalLen = 0;
    for (var k = 0; k < items.length; k++) {
      var len = items[k].path.getTotalLength();
      lengths.push(len);
      totalLen += len;
      items[k].path.style.strokeDasharray = len + ' ' + len;
      items[k].path.style.strokeDashoffset = len;
    }

    if (totalLen === 0) {
      penTip.style.display = 'none';
      resolve();
      return;
    }

    penTip.style.display = 'block';
    var startTime = performance.now();
    var animFrameId = null;
    var cancelled = false;

    var controller = {
      cancel: function() {
        cancelled = true;
        if (animFrameId) cancelAnimationFrame(animFrameId);
        penTip.style.display = 'none';
        for (var n = 0; n < items.length; n++) {
          items[n].path.style.strokeDashoffset = '0';
        }
        resolve();
      }
    };
    activeLineAnimation = controller;

    function step(now) {
      if (cancelled) return;
      var elapsed = now - startTime;
      var progress = Math.min(1, elapsed / duration);
      var currentDist = progress * totalLen;

      var accumulated = 0;
      for (var j = 0; j < items.length; j++) {
        var sLen = lengths[j];
        if (currentDist >= accumulated + sLen) {
          items[j].path.style.strokeDashoffset = '0';
          accumulated += sLen;
        } else if (currentDist > accumulated) {
          var distOnStroke = currentDist - accumulated;
          items[j].path.style.strokeDashoffset = (sLen - distOnStroke);

          var pt = items[j].path.getPointAtLength(distOnStroke);
          var s = items[j].scale;
          var penX = pt.x * s + items[j].tx;
          var penY = pt.y * s + items[j].ty;
          penTip.setAttribute('cx', penX);
          penTip.setAttribute('cy', penY);
          accumulated += sLen;
        } else {
          items[j].path.style.strokeDashoffset = sLen;
        }
      }

      if (progress < 1) {
        animFrameId = requestAnimationFrame(step);
      } else {
        penTip.style.display = 'none';
        for (var m = 0; m < items.length; m++) {
          items[m].path.style.strokeDashoffset = '0';
        }
        activeLineAnimation = null;
        resolve();
      }
    }

    animFrameId = requestAnimationFrame(step);
  });
}

      }

function formatMathLine(raw) {

  try {
    var re = /(\^{2,})|(\bint\b\s*)|(sqrt\()|(\bpi\b)|(\^\(([^)]+)\))|(\^(?:(-\d+)|\b(\d+)\b|([a-zA-Z])(?![a-zA-Z0-9])))|(\s+\b(d[xyzut])\b(?!\/))/g;
    var lastIdx = 0;
    var match;

    while ((match = re.exec(str)) !== null) {
      if (match.index > lastIdx) {
        frag.appendChild(formatTextChunk(str.slice(lastIdx, match.index)));
      }
      if (match[1]) {
        frag.appendChild(formatTextChunk(match[1]));

        frag.appendChild(createSvgSymbol('int'));

          }

        if (closeIdx !== -1) {
          var argStr = str.slice(openIdx + 1, closeIdx);
          re.lastIndex = closeIdx + 1;

          var sqrtWrap = document.createElement('span');
          sqrtWrap.className = 'math-sqrt-wrap';
          sqrtWrap.style.display = 'inline-flex';
          sqrtWrap.style.alignItems = 'flex-start';
          sqrtWrap.style.position = 'relative';
          sqrtWrap.style.margin = '0 0.12em 0 0.08em';
          sqrtWrap.style.verticalAlign = '-0.16em';

          var approxW = 20;
          try {
            var mc = document.createElement('canvas');
            var mx = mc.getContext('2d');
            mx.font = '46px "Caveat", "Reenie Beanie", cursive';
            approxW = mx.measureText(argStr).width || (argStr.length * 18);

          var barWidth = Math.max(16, Math.round(approxW * 0.78));
          var svgRad = createSvgSymbol('sqrt', barWidth);
          svgRad.style.position = 'absolute';
          svgRad.style.left = '0';
          svgRad.style.top = '0';
          svgRad.style.height = '100%';
          svgRad.style.width = '100%';
          svgRad.style.pointerEvents = 'none';

          var argContentEl = document.createElement('span');
          argContentEl.className = 'math-sqrt-arg';
          argContentEl.style.display = 'inline-block';
          argContentEl.style.paddingLeft = '0.50em';
          argContentEl.style.paddingRight = '0.14em';
          argContentEl.style.paddingTop = '0.24em';
          argContentEl.appendChild(formatMathLine(argStr));

          sqrtWrap.appendChild(svgRad);
          sqrtWrap.appendChild(argContentEl);

          setTimeout(function(wEl, sSvg) {
            try {
              var actualW = wEl.getBoundingClientRect().width;

                var pEl = sSvg.querySelector('path');
                if (pEl) {

        frag.appendChild(createSvgSymbol('pi'));
      } else if (match[5]) {
        var supEl = document.createElement('span');
        supEl.className = 'math-sup';
        supEl.style.fontSize = (window.EXPONENT_SCALE || 0.58) + 'em';
        supEl.style.verticalAlign = (window.EXPONENT_SHIFT || '0.44em');
        supEl.style.marginRight = (window.EXPONENT_RIGHT_GAP || '0.16em');
        supEl.appendChild(formatMathLine(match[6]));
        frag.appendChild(supEl);
      } else if (match[7]) {
        var expVal = match[8] || match[9] || match[10];
        var sEl = document.createElement('span');
        sEl.className = 'math-sup';
        sEl.style.fontSize = (window.EXPONENT_SCALE || 0.58) + 'em';
        sEl.style.verticalAlign = (window.EXPONENT_SHIFT || '0.44em');
        sEl.style.marginRight = (window.EXPONENT_RIGHT_GAP || '0.16em');
        sEl.appendChild(formatTextChunk(expVal));
        frag.appendChild(sEl);
      } else if (match[11]) {

        diffSpan.className = 'math-diff';
        diffSpan.style.marginLeft = (window.DIFFERENTIAL_GAP || '0.24em');
        diffSpan.textContent = match[12];
        frag.appendChild(diffSpan);

    }
    if (lastIdx < str.length) {

function loadPersistedData() {
  try {
    var rawStrokes = localStorage.getItem(STROKES_KEY);

  } catch (e) { pageStrokes = {}; }

      var seededEdits = JSON.parse(rawEdits);
      for (var k in seededEdits) {
        var idx = +k;
        if (pages[idx] && seededEdits[k]) {
          if (seededEdits[k].t) pages[idx].t = seededEdits[k].t;
          if (seededEdits[k].l) pages[idx].l = seededEdits[k].l;
          if (seededEdits[k].c) pages[idx].c = seededEdits[k].c;
          if (seededEdits[k].fig) pages[idx].fig = seededEdits[k].fig;

  try {
    var rawPages = localStorage.getItem(PAGES_KEY);

        custom.forEach(function(cp) {
          if (cp && cp.t && pages.length < 30) {
            pages.push(cp);

  } catch (e) {}

  try {
    var rawAi = localStorage.getItem(AI_OUTPUT_KEY);
    if (rawAi) pageAiOutput = JSON.parse(rawAi) || {};
  } catch (e) { pageAiOutput = {}; }
}

// --- Geometry Helpers for Distance & Stroke Intersection ---
function distToSegment(px, py, x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1;
  var l2 = dx * dx + dy * dy;
  if (l2 === 0) return Math.hypot(px - x1, py - y1);
  var t = ((px - x1) * dx + (py - y1) * dy) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function strokeHits(s, px, py, radius) {
  var pts = s.points;
  if (!pts || !pts.length) return false;
  var thresh = radius + ((s.width || 2.4) / 2);
  if (pts.length === 1) {
    return Math.hypot(pts[0].x - px, pts[0].y - py) <= thresh;
  }
  for (var i = 0; i < pts.length - 1; i++) {
    if (distToSegment(px, py, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y) <= thresh) {
      return true;
    }
  }
  return false;
}

function eraseAiAt(px, py, radius) {
  try {
    var cvRect = cv.getBoundingClientRect();
    var ai = pageAiOutput[cur];

    if (!ai) return false;

    var changed = false;

    // 1. Check AI solution step lines
    if (ai.steps && ai.steps.length > 0) {
      var stepEls = notes.querySelectorAll('.ln.ai[id^="step-"]');
      for (var i = 0; i < stepEls.length; i++) {
        var el = stepEls[i];
        var rect = el.getBoundingClientRect();
        var x1 = rect.left - cvRect.left - radius;
        var x2 = rect.right - cvRect.left + radius;
        var y1 = rect.top - cvRect.top - radius;
        var y2 = rect.bottom - cvRect.top + radius;

        if (px >= x1 && px <= x2 && py >= y1 && py <= y2) {
          var idx = parseInt(el.id.replace('step-', ''), 10);
          if (isNaN(idx)) idx = i;
          if (idx >= 0 && idx < ai.steps.length) {
            // If erasing during active solve or narration, stop voice and animation cleanly
            if (busy) {
              stopVoiceAndAnimation();
            } else {
              cancelActiveAnimation();
            }
            var removedStep = ai.steps.splice(idx, 1)[0];
            var removedCited = null;
            // Tied margin element (Page 1 callback): removed if step tied to it or all steps removed
            if (ai.cited && (ai.steps.length === 0 || idx >= ai.steps.length)) {
              removedCited = ai.cited;
              ai.cited = null;
              var mk = $('#mk');
              if (mk) mk.remove();
            }
            savePersistedAiOutput();
            pushUndo({
              type: 'ai-erase',
              step: removedStep,
              index: idx,
              cited: removedCited
            });
            el.remove();
            if (ai.steps.length === 0) {
              var mkRem = $('#mk');
              if (mkRem) mkRem.remove();
            }
            var remainingEls = notes.querySelectorAll('.ln.ai[id^="step-"]');
            remainingEls.forEach(function(sEl, nIdx) {
              sEl.id = 'step-' + nIdx;
            });
            updateClearSolBtn();
            changed = true;
            break;
          }
        }
      }
    }

    // 2. Check Question Header line
    var qEl = notes.querySelector('#ai-question') || notes.querySelector('.q-hdr');
    if (qEl && ai.question) {
      var qRect = qEl.getBoundingClientRect();
      var qx1 = qRect.left - cvRect.left - radius;
      var qx2 = qRect.right - cvRect.left + radius;
      var qy1 = qRect.top - cvRect.top - radius;
      var qy2 = qRect.bottom - cvRect.top + radius;

      if (px >= qx1 && px <= qx2 && py >= qy1 && py <= qy2) {
        var removedQ = ai.question;
        ai.question = '';
        savePersistedAiOutput();
        pushUndo({ type: 'ai-erase-question', question: removedQ });
        var spEl = qEl.nextElementSibling;
        if (spEl && spEl.classList.contains('sp')) spEl.remove();
        qEl.remove();
        updateClearSolBtn();
        changed = true;
      }
    }

    // 3. Check Page 1 callback margin button (#mk)
    var mkEl = $('#mk');
    if (mkEl && ai.cited) {
      var mRect = mkEl.getBoundingClientRect();
      var mx1 = mRect.left - cvRect.left - radius;
      var mx2 = mRect.right - cvRect.left + radius;
      var my1 = mRect.top - cvRect.top - radius;
      var my2 = mRect.bottom - cvRect.top + radius;

      if (px >= mx1 && px <= mx2 && py >= my1 && py <= my2) {
        var prevCited = ai.cited;
        ai.cited = null;
        savePersistedAiOutput();
        pushUndo({ type: 'ai-erase-cited', cited: prevCited });
        mkEl.remove();
        changed = true;
      }
    }

    return changed;
  } catch (err) {
    console.error('eraseAiAt error:', err);
    return false;
  }
}

function eraseAt(px, py) {
  if (busy || solveInProgressSeqId !== null) {
    stopVoiceAndAnimation();
  }
  var list = getStrokes(cur);
  var ERASE_RADIUS = 16;
  var remaining = list.filter(function(s) {
    return !strokeHits(s, px, py, ERASE_RADIUS);
  });
  if (remaining.length !== list.length) {
    setStrokes(cur, remaining);
    redoHistory[cur] = [];
    redraw();
  }
  eraseAiAt(px, py, ERASE_RADIUS);
}

// --- Stroke Rendering with Smooth Quadratic Curves ---
function renderStroke(s, targetCx) {
  var ctx = targetCx || cx;
  var p = s.points;
  if (!p || p.length === 0) return;
  ctx.save();
  ctx.strokeStyle = s.color || '#111118';
  ctx.fillStyle = s.color || '#111118';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = s.width || 2.4;

  if (p.length === 1) {
    ctx.beginPath();
    ctx.arc(p[0].x, p[0].y, (s.width || 2.4) / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return;
  }

  if (p.length === 2) {
    ctx.beginPath();
    ctx.moveTo(p[0].x, p[0].y);
    ctx.lineTo(p[1].x, p[1].y);
    ctx.stroke();
    ctx.restore();
    return;
  }

  ctx.beginPath();
  ctx.moveTo(p[0].x, p[0].y);
  for (var i = 1; i < p.length - 1; i++) {
    var midX = (p[i].x + p[i + 1].x) / 2;
    var midY = (p[i].y + p[i + 1].y) / 2;
    ctx.quadraticCurveTo(p[i].x, p[i].y, midX, midY);
  }
  ctx.lineTo(p[p.length - 1].x, p[p.length - 1].y);
  ctx.stroke();
  ctx.restore();
}

function redraw() {
  var d = window.devicePixelRatio || 1;
  cx.clearRect(0, 0, cv.width / d, cv.height / d);
  var list = getStrokes(cur);
  for (var i = 0; i < list.length; i++) {
    renderStroke(list[i]);
  }
  if (currentStroke) {
    renderStroke(currentStroke);
  }
}

function size() {
  var w = paper.clientWidth;
  if (!w) return;
  var d = window.devicePixelRatio || 1;
  var contentH = notes ? notes.scrollHeight : 0;
  var visibleH = paper.clientHeight;
  var fullH = Math.max(visibleH, contentH);
  if (!fullH) return;

  cv.width = Math.round(w * d);
  cv.height = Math.round(fullH * d);
  cv.style.width = w + 'px';
  cv.style.height = fullH + 'px';
  cx.setTransform(d, 0, 0, d, 0, 0);

  ov.width = cv.width;
  ov.height = cv.height;
  ov.style.width = w + 'px';
  ov.style.height = fullH + 'px';
  ox.setTransform(d, 0, 0, d, 0, 0);

  redraw();
}

// --- Drawing / Pointer Event State ---
var currentStroke = null;
var loopPoints = null;
var activePointerId = null;
var lastPenTime = 0;
var currentCircleBox = null;

function getPt(e) {
  var r = cv.getBoundingClientRect();
  return {
    x: e.clientX - r.left,
    y: e.clientY - r.top,
    pressure: (e.pointerType === 'pen' && e.pressure > 0) ? e.pressure : 0.5,
    t: Date.now()
  };
}

cv.addEventListener('pointerdown', function(e) {
  if (e.button > 0) return;
  if (busy && tool !== 'era') return;

  if (e.pointerType === 'pen') {
    lastPenTime = Date.now();
  } else if (e.pointerType === 'touch') {
    if (Date.now() - lastPenTime < 1000) {
      e.preventDefault();
      return;
    }
  }

  e.preventDefault();
  activePointerId = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}

  var pt = getPt(e);

  if (tool === 'era') {
    eraseAt(pt.x, pt.y);
    return;
  }

  if (tool === 'circle') {
    ring.classList.remove('on');
    hideConfirmPanel();
    loopPoints = [pt];
    var d = window.devicePixelRatio || 1;
    ox.clearRect(0, 0, ov.width / d, ov.height / d);
    return;
  }

  var isPen = e.pointerType === 'pen' && e.pressure > 0;
  var w = isPen ? (1.5 + e.pressure * 2.8) : 2.4;

  currentStroke = {
    tool: 'pen',
    color: col,
    width: w,
    points: [pt]
  };

  renderStroke(currentStroke);
});

cv.addEventListener('pointermove', function(e) {
  if (activePointerId === null || e.pointerId !== activePointerId) return;
  e.preventDefault();

  var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];

  if (tool === 'era') {
    for (var i = 0; i < evs.length; i++) {
      var p = getPt(evs[i]);
      eraseAt(p.x, p.y);
    }
    return;
  }

  if (tool === 'circle') {
    if (!loopPoints) return;
    for (var k = 0; k < evs.length; k++) {
      loopPoints.push(getPt(evs[k]));
    }
    drawLoopPreview();
    return;
  }

  if (!currentStroke) return;

  for (var j = 0; j < evs.length; j++) {
    currentStroke.points.push(getPt(evs[j]));
  }

  redraw();
});

function drawLoopPreview() {
  var d = window.devicePixelRatio || 1;
  ox.clearRect(0, 0, ov.width / d, ov.height / d);
  if (!loopPoints || loopPoints.length < 2) return;
  ox.save();
  ox.strokeStyle = '#7C5CFF';
  ox.lineWidth = 2.4;
  ox.setLineDash([5, 4]);
  ox.beginPath();
  ox.moveTo(loopPoints[0].x, loopPoints[0].y);
  for (var i = 1; i < loopPoints.length; i++) {
    ox.lineTo(loopPoints[i].x, loopPoints[i].y);
  }
  ox.stroke();
  ox.restore();
}

function endStroke(e) {
  if (activePointerId === null || (e && e.pointerId !== activePointerId)) return;
  try {
    if (cv.hasPointerCapture && cv.hasPointerCapture(activePointerId)) {
      cv.releasePointerCapture(activePointerId);
    }
  } catch (err) {}
  activePointerId = null;

  if (tool === 'era') return;

  if (tool === 'circle') {
    var d = window.devicePixelRatio || 1;
    ox.clearRect(0, 0, ov.width / d, ov.height / d);
    if (!loopPoints || loopPoints.length < 3) {
      loopPoints = null;
      return;
    }
    handleCircleGesture(loopPoints);
    loopPoints = null;
    return;
  }

  if (currentStroke && currentStroke.points.length > 0) {
    var list = getStrokes(cur);
    list.push(currentStroke);
    setStrokes(cur, list);
    redoHistory[cur] = [];
    pushUndo({ type: 'stroke', stroke: currentStroke });
    currentStroke = null;
    redraw();
  }
}

// Action-level Undo System
var UNDO_KEY = 'inkmentor_notebook_undo_v1';
var undoHistory = {};

function loadUndoHistory() {
  try {
    var raw = sessionStorage.getItem(UNDO_KEY) || localStorage.getItem(UNDO_KEY);
    if (raw) undoHistory = JSON.parse(raw) || {};
  } catch (e) { undoHistory = {}; }
}

function saveUndoHistory() {
  try {
    var data = JSON.stringify(undoHistory);
    sessionStorage.setItem(UNDO_KEY, data);
    localStorage.setItem(UNDO_KEY, data);
  } catch (e) {}
}

loadUndoHistory();

function pushUndo(action) {
  undoHistory[cur] = undoHistory[cur] || [];
  undoHistory[cur].push(action);
  saveUndoHistory();
}

function updateClearSolBtn() {
  var btn = $('#clear-sol-btn');
  if (!btn) return;
  var ai = pageAiOutput[cur];
  var hasAi = ai && ((ai.steps && ai.steps.length > 0) || !!ai.question);
  btn.style.display = hasAi ? 'inline-flex' : 'none';
}

function undoAction() {
  if (busy) return;
  var pageUndo = undoHistory[cur] || [];
  if (pageUndo.length > 0) {
    var entry = pageUndo.pop();
    saveUndoHistory();
    if (entry.type === 'ai-erase' || entry.type === 'ai-erase-step') {
      var ai = pageAiOutput[cur];
      if (!ai) {
        ai = { question: '', steps: [] };
        pageAiOutput[cur] = ai;
      }
      if (!ai.steps) ai.steps = [];
      var insertIdx = Math.min(entry.index, ai.steps.length);
      ai.steps.splice(insertIdx, 0, entry.step);
      if (entry.cited) ai.cited = entry.cited;
      savePersistedAiOutput();
      render();
      toast('Restored erased AI step');
      return;
    }
    if (entry.type === 'ai-erase-question') {
      var ai = pageAiOutput[cur];
      if (!ai) {
        ai = { question: '', steps: [] };
        pageAiOutput[cur] = ai;
      }
      ai.question = entry.question;
      savePersistedAiOutput();
      render();
      toast('Restored question');
      return;
    }
    if (entry.type === 'ai-erase-cited') {
      var ai = pageAiOutput[cur];
      if (ai) {
        ai.cited = entry.cited;
        savePersistedAiOutput();
        render();
      }
      return;
    }
    if (entry.type === 'ai-clear-solution') {
      pageAiOutput[cur] = entry.aiData;
      delete clearedPages[cur];
      savePersistedAiOutput();
      render();
      toast('Restored AI solution');
      return;
    }
    if (entry.type === 'stroke') {
      var list = getStrokes(cur);
      if (list.length > 0) {
        var popped = list.pop();
        redoHistory[cur] = redoHistory[cur] || [];
        redoHistory[cur].push(popped);
        setStrokes(cur, list);
        redraw();
        return;
      }
    }
  }

  // Fallback to popping strokes if undoHistory is empty
  var list = getStrokes(cur);
  if (list.length > 0) {
    var popped = list.pop();
    redoHistory[cur] = redoHistory[cur] || [];
    redoHistory[cur].push(popped);
    setStrokes(cur, list);
    redraw();
  }
}

                 '</div>' +

var VOICE_LANGS = [
  { code: 'en-US', name: 'English' },
  { code: 'ta-IN', name: 'Tamil / Tanglish' },

];

var cachedVoices = [];
function loadVoices() {
  if (typeof window !== 'undefined' && window.speechSynthesis) {
    cachedVoices = window.speechSynthesis.getVoices() || [];
  }
}
if (typeof window !== 'undefined' && window.speechSynthesis) {

var hasLoggedVoice = false;
function logVoiceOnce(v) {
  if (!hasLoggedVoice && v && v.name) {
    hasLoggedVoice = true;
    console.log(v.name);
  }
}

function pickBestVoice(targetLangCode) {
  if (!cachedVoices || !cachedVoices.length) {
    loadVoices();
  }
  var voices = cachedVoices;
  if (!voices || !voices.length) return null;

  var chosen = null;
  var langPrefix = (targetLangCode || 'en-US').split('-')[0].toLowerCase();
  if (langPrefix === 'en') {
    // 1. Prefer en-IN voice if present
    var enIn = voices.find(function(v) {
      return v.lang && v.lang.toLowerCase().replace('_', '-').startsWith('en-in');
    });
    if (enIn) chosen = enIn;

    // 2. Otherwise a voice whose name includes 'Natural', 'Google', or 'Neural'
    if (!chosen) {
      var premiumEn = voices.find(function(v) {
        if (!v.lang || !v.lang.toLowerCase().startsWith('en')) return false;
        var name = (v.name || '').toLowerCase();
        return name.includes('natural') || name.includes('google') || name.includes('neural');
      });
      if (premiumEn) chosen = premiumEn;
    }

    // 3. Otherwise any English voice
    if (!chosen) {
      var anyEn = voices.find(function(v) {
        return v.lang && v.lang.toLowerCase().startsWith('en');
      });
      if (anyEn) chosen = anyEn;
    }
  } else {
    var match = voices.find(function(v) {
      return v.lang && v.lang.toLowerCase().replace('_', '-').startsWith(langPrefix);
    });
    if (match) chosen = match;
  }

  if (chosen) logVoiceOnce(chosen);
  return chosen;
}

async function fetchTtsAudio(text, signal, position) {
  var clean = cleanNarrationText(text);
  if (!clean) return null;
  var bodyObj = { text: clean, position: position || 'middle' };
  var resp = await fetch((API_BASE || '') + '/api/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(bodyObj),
    signal: signal
  });
  if (!resp.ok) {
    throw new Error('TTS status ' + resp.status);
  }
  var provider = resp.headers.get('x-tts-provider') || 'gemini';
  var blob = await resp.blob();
  var url = URL.createObjectURL(blob);
  var duration = await new Promise(function(resolve) {
    var tempAudio = new Audio();
    var timeout = setTimeout(function() {
      var estSec = Math.max(1, (blob.size - 44) / 48000.0);
      resolve(estSec);
    }, 500);
    tempAudio.onloadedmetadata = function() {
      clearTimeout(timeout);
      var d = tempAudio.duration;
      if (isFinite(d) && d > 0) resolve(d);
      else resolve(Math.max(1, (blob.size - 44) / 48000.0));
    };
    tempAudio.onerror = function() {
      clearTimeout(timeout);
      resolve(Math.max(1, (blob.size - 44) / 48000.0));
    };
    tempAudio.src = url;
  });
  return { blob: blob, url: url, duration: duration, provider: provider };
}

function getTtsAudioPromise(text, seqId, position) {
  var clean = cleanNarrationText(text);
  if (!clean) return Promise.resolve(null);
  var pos = position || 'middle';
  var cacheKey = pos + ':' + clean;
  if (ttsPrefetchMap[cacheKey]) {
    return ttsPrefetchMap[cacheKey];
  }
  if (!ttsAbortController || ttsAbortController.signal.aborted) {
    ttsAbortController = new AbortController();
  }
  var signal = ttsAbortController ? ttsAbortController.signal : null;
  var p = fetchTtsAudio(clean, signal, pos).catch(function(err) {
    if (signal && signal.aborted) return null;
    console.warn('[InkMentor TTS] Fallback to browser voice:', err.message);
    return null;
  });
  ttsPrefetchMap[cacheKey] = p;
  return p;
}

function prefetchAllTtsSteps(steps, seqId, maxConcurrency) {
  if (!steps || !steps.length) return;
  maxConcurrency = maxConcurrency || (window.TTS_PREFETCH_CONCURRENCY || 3);
  var nextIdx = 0;

  function launchNext() {
    if (nextIdx >= steps.length || (seqId !== undefined && seqId !== activeSolveSeqId)) return;
    var idx = nextIdx++;
    var text = steps[idx].narration;
    var pos = (idx === 0) ? 'first' : (idx === steps.length - 1 ? 'last' : 'middle');
    getTtsAudioPromise(text, seqId, pos).finally(function() {
      launchNext();
    });
  }

  var initialCount = Math.min(maxConcurrency, steps.length);
  for (var c = 0; c < initialCount; c++) {
    launchNext();
  }
}

function interruptibleWait(ms, seqId) {
  return new Promise(function(resolve) {
    var t = setTimeout(function() {
      if (seqId !== undefined && seqId !== activeSolveSeqId) {
        resolve(false);
      } else {
        resolve(true);
      }
    }, ms);
    activeStepTimer = t;
  });
}

/* === VOICE ARBITER === */
var VoiceArbiter = (function() {
  var sharedAudio = new Audio();
  var currentToken = 0;
  var arbiterState = 'idle'; // 'idle' | 'loading' | 'playing' | 'ended' | 'failed'
  var currentProvider = 'none'; // 'gemini' | 'groq' | 'browser' | 'none'
  var lastDowngradedProvider = null; // per-solve downgrade lock: 'groq' | 'browser'
  var lastSolveSeq = -1;
  var safetyTimer = null;
  var budgetTimer = null;
  var hardWatchdogTimer = null;
  var invariantInterval = null;

  function init() {
    sharedAudio.onended = function() {
      arbiterState = 'ended';
      currentProvider = 'none';
      try {
        sharedAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
      } catch (e) {}
      var chip = $('#chip');
      if (chip) chip.classList.remove('on');
    };
    sharedAudio.onerror = function() {
      // Ignore empty src, unassigned src, page URL assignments, or silent WAV resets
      if (!sharedAudio.src || sharedAudio.src === '' || sharedAudio.src === window.location.href || sharedAudio.src.indexOf('data:audio/wav') !== -1) {
        return;
      }
      arbiterState = 'failed';
      currentProvider = 'none';
      var chip = $('#chip');
      if (chip) chip.classList.remove('on');
    };

    // Invariant check: sharedAudio and speechSynthesis must NEVER both be playing
    if (typeof window !== 'undefined') {
      window.DEBUG_VOICE = true;
      if (invariantInterval) clearInterval(invariantInterval);
      invariantInterval = setInterval(function() {
        var audioPlaying = !sharedAudio.paused && !sharedAudio.ended && sharedAudio.currentTime > 0;
        var speechSpeaking = !!(window.speechSynthesis && window.speechSynthesis.speaking);
        if (audioPlaying && speechSpeaking) {
          console.error('[Voice Arbiter INVARIANT VIOLATION] Simultaneous audio playback detected! Stopping browser voice.');
          try { window.speechSynthesis.cancel(); } catch (e) {}
        }
      }, 50);
    }
  }

  function stop() {
    currentToken++;
    arbiterState = 'idle';
    currentProvider = 'none';
    if (safetyTimer) { clearTimeout(safetyTimer); safetyTimer = null; }
    if (budgetTimer) { clearTimeout(budgetTimer); budgetTimer = null; }
    if (hardWatchdogTimer) { clearTimeout(hardWatchdogTimer); hardWatchdogTimer = null; }
    try {
      sharedAudio.pause();
      sharedAudio.currentTime = 0;
      sharedAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
    } catch (e) {}
    if (typeof window !== 'undefined' && window.speechSynthesis) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
    var chip = $('#chip');
    if (chip) chip.classList.remove('on');
  }

  function resetDowngrade(seqId) {
    if (seqId !== lastSolveSeq) {
      lastSolveSeq = seqId;
      lastDowngradedProvider = null;
    }
  }

  function playBrowserUtterance(clean, estimatedDur, myToken, resolve) {
    if (!voice || typeof window === 'undefined' || !window.speechSynthesis) {
      arbiterState = 'ended';
      currentProvider = 'none';
      resolve({ provider: 'none', durationMs: 0, endedNaturally: true });
      return;
    }

    try {
      sharedAudio.pause();
      sharedAudio.currentTime = 0;
    } catch (e) {}

    arbiterState = 'playing';
    currentProvider = 'browser';

    var settled = false;
    function settle(natural) {
      if (settled) return;
      settled = true;
      if (safetyTimer) { clearTimeout(safetyTimer); safetyTimer = null; }
      if (currentToken === myToken) {
        arbiterState = 'ended';
        currentProvider = 'none';
        var chip = $('#chip');
        if (chip) chip.classList.remove('on');
      }
      resolve({ provider: 'browser', durationMs: estimatedDur || 2000, endedNaturally: natural !== false });
    }

    try {
      var u = new SpeechSynthesisUtterance(clean);
      window._activeUtterance = u;
      var curLang = VOICE_LANGS[voiceLangIdx] || { code: 'en-US' };
      u.lang = curLang.code;
      u.rate = VOICE_RATE;
      u.pitch = VOICE_PITCH;
      var chosenVoice = pickBestVoice(curLang.code);
      if (chosenVoice) u.voice = chosenVoice;
      u.onend = function() { window._activeUtterance = null; settle(true); };
      u.onerror = function() { window._activeUtterance = null; settle(false); };
      safetyTimer = setTimeout(function() { settle(true); }, (estimatedDur || 2000) + 1200);
      recordPerfMark('first_audio_started');
      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }
      window.speechSynthesis.speak(u);
    } catch (err) {
      settle(false);
    }
  }

  function speak(text, options) {
    options = options || {};
    var solveSeq = options.solveSeq;
    var position = options.position || 'middle';
    var estimatedDur = options.estimatedDur || 2000;
    var preloadedCloudAudio = options.preloadedCloudAudio;

    if (solveSeq !== undefined) {
      resetDowngrade(solveSeq);
    }

    stop();

    var myToken = ++currentToken;
    var clean = cleanNarrationText(text);
    if (!clean) {
      return Promise.resolve({ provider: 'none', durationMs: 0, endedNaturally: true });
    }

    var ct = $('#ct');
    if (ct) ct.textContent = clean;
    var chip = $('#chip');
    if (chip) chip.classList.add('on');

    if (!voice) {
      return new Promise(function(resolve) {
        safetyTimer = setTimeout(function() {
          if (myToken === currentToken) {
            arbiterState = 'idle';
            if (chip) chip.classList.remove('on');
          }
          resolve({ provider: 'none', durationMs: 0, endedNaturally: true });
        }, Math.min(estimatedDur, 2000));
      });
    }

    return new Promise(function(resolve) {
      var promiseSettled = false;
      function settlePromise(res) {
        if (promiseSettled) return;
        promiseSettled = true;
        if (hardWatchdogTimer) { clearTimeout(hardWatchdogTimer); hardWatchdogTimer = null; }
        if (safetyTimer) { clearTimeout(safetyTimer); safetyTimer = null; }
        if (budgetTimer) { clearTimeout(budgetTimer); budgetTimer = null; }
        resolve(res);
      }

      // Hard safety watchdog: speak MUST ALWAYS resolve within bounded time
      var maxWatchdogMs = Math.max(estimatedDur || 2000, 2000) + 4000;
      hardWatchdogTimer = setTimeout(function() {
        if (myToken === currentToken && !promiseSettled) {
          console.warn('[Voice Arbiter] Hard watchdog fired (' + maxWatchdogMs + 'ms), forcing resolve.');
          if (chip) chip.classList.remove('on');
          arbiterState = 'ended';
          currentProvider = 'none';
          settlePromise({ provider: 'none', durationMs: 0, endedNaturally: false });
        }
      }, maxWatchdogMs);

      if (TTS_MODE !== 'cloud' || lastDowngradedProvider === 'browser') {
        playBrowserUtterance(clean, estimatedDur, myToken, settlePromise);
        return;
      }

      arbiterState = 'loading';
      var budgetMs = (position === 'first') ? (window.FIRST_AUDIO_BUDGET_MS || 3500) : (window.STEP_AUDIO_BUDGET_MS || 2500);
      var cloudStarted = false;

      budgetTimer = setTimeout(function() {
        if (!cloudStarted && myToken === currentToken && (arbiterState === 'loading' || arbiterState === 'idle')) {
          console.warn('[Voice Arbiter] Audio budget expired (' + budgetMs + 'ms), falling back to browser voice');
          lastDowngradedProvider = 'browser';
          playBrowserUtterance(clean, estimatedDur, myToken, settlePromise);
        }
      }, budgetMs);

      var audioPromise = null;
      if (preloadedCloudAudio && preloadedCloudAudio.url) {
        audioPromise = Promise.resolve(preloadedCloudAudio);
      } else {
        var cacheKey = position + ':' + clean;
        if (ttsPrefetchMap[cacheKey]) {
          audioPromise = ttsPrefetchMap[cacheKey];
        } else {
          audioPromise = fetchTtsAudio(clean, null, position);
        }
      }

      audioPromise.then(function(audioItem) {
        if (myToken !== currentToken) {
          return;
        }
        if (!audioItem || !audioItem.url) {
          throw new Error('No audio payload');
        }
        if (arbiterState !== 'loading' && arbiterState !== 'idle') {
          return;
        }

        cloudStarted = true;
        if (budgetTimer) { clearTimeout(budgetTimer); budgetTimer = null; }

        var prov = audioItem.provider || 'gemini';
        if (prov === 'groq') {
          lastDowngradedProvider = 'groq';
        }
        currentProvider = prov;
        arbiterState = 'playing';

        unlockAudio();
        if (typeof window !== 'undefined' && window.speechSynthesis) {
          try { window.speechSynthesis.cancel(); } catch (e) {}
        }

        var rate = TTS_PLAYBACK_RATE || 1.05;
        sharedAudio.src = audioItem.url;
        sharedAudio.playbackRate = rate;
        if ('preservesPitch' in sharedAudio) sharedAudio.preservesPitch = true;
        else if ('webkitPreservesPitch' in sharedAudio) sharedAudio.webkitPreservesPitch = true;

        var settled = false;
        function settle(natural) {
          if (settled) return;
          settled = true;
          if (safetyTimer) { clearTimeout(safetyTimer); safetyTimer = null; }
          if (myToken === currentToken) {
            arbiterState = 'ended';
            currentProvider = 'none';
            if (chip) chip.classList.remove('on');
          }
          var durMs = (audioItem.duration || (estimatedDur / 1000)) * 1000;
          settlePromise({ provider: prov, durationMs: durMs, endedNaturally: natural !== false });
        }

        sharedAudio.onended = function() { settle(true); };
        sharedAudio.onerror = function() {
          if (!settled && myToken === currentToken) {
            console.warn('[Voice Arbiter] sharedAudio playback error; falling back to browser voice');
            lastDowngradedProvider = 'browser';
            playBrowserUtterance(clean, estimatedDur, myToken, settlePromise);
          }
        };

        var durSec = (audioItem.duration || (estimatedDur / 1000)) / rate;
        safetyTimer = setTimeout(function() { settle(true); }, Math.round(durSec * 1000) + 1500);

        recordPerfMark('first_audio_started');
        sharedAudio.play().catch(function(playErr) {
          if (settled) return;
          if (playErr && playErr.name === 'NotAllowedError') {
            showTapToEnableVoiceNotice();
          }
          if (myToken === currentToken) {
            lastDowngradedProvider = 'browser';
            playBrowserUtterance(clean, estimatedDur, myToken, settlePromise);
          }
        });
      }).catch(function(err) {
        if (myToken !== currentToken) return;
        if (arbiterState === 'loading' || arbiterState === 'idle') {
          if (budgetTimer) { clearTimeout(budgetTimer); budgetTimer = null; }
          console.warn('[Voice Arbiter] Cloud fetch failed (' + err.message + '); falling back to browser voice');
          lastDowngradedProvider = 'browser';
          playBrowserUtterance(clean, estimatedDur, myToken, settlePromise);
        }
      });
    });
  }

  function unlock() {
    try {
      if (arbiterState !== 'playing') {
        sharedAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
        var p = sharedAudio.play();
        if (p && p.catch) p.catch(function() {});
      }
    } catch (e) {}
    if (typeof window !== 'undefined' && window.speechSynthesis) {
      try {
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        }
      } catch (e) {}
    }
  }

  init();

  return {
    speak: speak,
    stop: stop,
    unlock: unlock,
    getState: function() { return arbiterState; },
    getProvider: function() { return currentProvider; },
    getSharedAudio: function() { return sharedAudio; }
  };
})();
/* === END VOICE ARBITER === */

// --- Inline Notes Editing System ---
function startEditingLine(ln) {
  if (ln.isContentEditable || ln.classList.contains('ai') || ln.id === 'ai-question') return;
  var idx = +ln.dataset.idx;
  if (isNaN(idx)) return;

  ln.contentEditable = 'true';
  ln.style.pointerEvents = 'auto';
  ln.focus();

  try {
    var range = document.createRange();
    range.selectNodeContents(ln);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  } catch (err) {}

  ln.style.outline = '1.5px dashed var(--ac)';
  ln.style.borderRadius = '6px';
  ln.style.padding = '2px 6px';
  ln.style.background = 'color-mix(in srgb, var(--ac) 8%, transparent)';

  function finishEditing() {
    ln.contentEditable = 'false';
    ln.style.pointerEvents = 'none';
    ln.style.outline = 'none';
    ln.style.borderRadius = '';
    ln.style.padding = '';
    ln.style.background = 'transparent';

    var p = pages[cur - 1];
    if (p && p.l && idx >= 0 && idx < p.l.length) {
      var newText = ln.innerText.replace(/[\r\n]+$/, '');
      p.l[idx] = newText;
      if (idx === 0) {
        var cleanTitle = newText.replace(/^[✦•\s]+/, '').trim() || ('Page ' + cur);
        p.t = cleanTitle;
        list();
        $('#pg').textContent = 'Page ' + cur + ' · ' + p.t;
      }
      savePersistedPages();
    }
  }

  ln.addEventListener('blur', finishEditing, { once: true });
  ln.addEventListener('keydown', function(ev) {
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      ln.blur();
    } else if (ev.key === 'Escape') {
      ev.preventDefault();
      var p = pages[cur - 1];
      if (p && p.l && p.l[idx] !== undefined) ln.innerText = p.l[idx];
      ln.blur();
    }
  });
}

function startSpeculativeSolve(recognizedText) {

  abortSpeculativeSolve();
