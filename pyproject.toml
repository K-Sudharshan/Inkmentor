[project]
name = "inkmentor"
version = "1.0.0"
description = "InkMentor Math Solver API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.1",
    "uvicorn==0.54.0",
    "sympy==1.14.0",
    "pydantic==2.14.1",
    "google-genai==2.30.1",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
]

[tool.vercel]
entrypoint = "backend.main:app"
