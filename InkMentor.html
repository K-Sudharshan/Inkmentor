<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InkMentor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2f7;--glass:rgba(255,255,255,.66);--gb:rgba(255,255,255,.8);--line:rgba(0,0,0,.07);--tx:#1c1c1e;--tx2:#6e6e73;--ac:#6b4ef0;--sh:0 12px 44px rgba(0,0,0,.10);--g:32px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0f;--glass:rgba(32,32,40,.62);--gb:rgba(255,255,255,.09);--line:rgba(255,255,255,.09);--tx:#f5f5f7;--tx2:#9a9aa3;--ac:#a99bff;--sh:0 12px 44px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg:#0a0a0f;--glass:rgba(32,32,40,.62);--gb:rgba(255,255,255,.09);--line:rgba(255,255,255,.09);--tx:#f5f5f7;--tx2:#9a9aa3;--ac:#a99bff;--sh:0 12px 44px rgba(0,0,0,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.4 -apple-system,'Inter',system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:fixed;inset:0;display:flex;gap:12px;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.glass{background:var(--glass);backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%);border:1px solid var(--gb);box-shadow:var(--sh)}
#sb{width:268px;flex:none;border-radius:24px;padding:18px 14px 14px;display:flex;flex-direction:column;gap:14px;transition:width .35s cubic-bezier(.2,.8,.2,1),opacity .25s,padding .35s,margin .35s;overflow:hidden}
#app.hide #sb{width:0;padding:0;opacity:0;border-width:0;margin-right:-12px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#FFB347,#FF5E7E);display:grid;place-items:center;color:#2a0f14}
.logo .i{width:16px;height:16px}
.brand b{font:400 26px 'Instrument Serif',serif;letter-spacing:-.3px}
.brand i{font-style:italic;color:var(--ac)}
.sr{display:flex;align-items:center;gap:8px;padding:0 12px;height:36px;border-radius:12px;background:var(--line);color:var(--tx2)}
.sr input{flex:1;min-width:0;border:0;background:none;color:var(--tx);font:inherit;outline:none}
.lb{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--tx2);padding:0 8px}
#pl{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1;margin:-4px -4px 0;padding:4px}
.pi{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;text-align:left;transition:background .2s;white-space:nowrap}
.pi:hover{background:var(--line)}
.pi.on{background:color-mix(in srgb,var(--ac) 15%,transparent)}
.pi b{display:block;font-weight:600;font-size:14px}.pi small{color:var(--tx2);font-size:12px}
.pi.on b{color:var(--ac)}
.th{width:36px;height:46px;border-radius:7px;background:#fff;background-image:linear-gradient(rgba(0,0,0,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.2) 1px,transparent 1px);background-size:9px 9px;box-shadow:0 0 0 1px var(--line),0 3px 8px rgba(0,0,0,.08);flex:none}
#add-page{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;color:var(--tx);font-weight:600;font-size:13px;background:var(--line);white-space:nowrap;transition:background .2s}
#add-page:hover{filter:brightness(1.08)}
.mem{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--line);white-space:nowrap}
.mem b{display:block;font-weight:600}.mem small{color:var(--tx2);font-size:12px}
.mem i{width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 0 var(--ac);animation:pl 2.4s infinite}
@keyframes pl{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.st{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;color:var(--tx2);white-space:nowrap}.st:hover{background:var(--line)}
#mn{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
#hd{display:flex;align-items:center;gap:12px;min-height:52px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--tx);flex:none;transition:background .2s}
.ib:hover{background:var(--line)}
.ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl b{font-weight:600}.ttl span{color:var(--tx2);margin-left:8px}
.tb{display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tb::-webkit-scrollbar{display:none}
.tb .ib{width:38px;height:38px}
.tb .ib.on{background:var(--line);color:var(--ac)}
.dv{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
.dot{width:22px;height:22px;border-radius:50%;margin:0 3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);transition:transform .15s}
.dot.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
.sv{display:flex;align-items:center;gap:6px;height:38px;padding:0 16px 0 12px;margin-left:4px;border-radius:999px;background:linear-gradient(90deg,#FFB347,#FF5E7E);color:#2a0f14;font-weight:600;flex:none;transition:transform .15s,filter .2s}
.sv:hover{filter:brightness(1.06)}.sv:active{transform:scale(.97)}
.sv:disabled,.ib:disabled{opacity:0.4;cursor:not-allowed;pointer-events:none}
#paper{flex:1;position:relative;border-radius:24px;overflow:hidden;background:#fff;background-image:linear-gradient(rgba(0,0,0,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.2) 1px,transparent 1px);background-size:var(--g) var(--g);box-shadow:var(--sh),0 0 0 1px var(--line);color:#0b0b14;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;z-index:1}
#ov{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;pointer-events:none;z-index:2}
#notes{position:absolute;inset:0;padding:calc(var(--g)*2) var(--g);display:flex;flex-direction:column;align-items:flex-start;pointer-events:none;font:400 calc(var(--g)*1.9)/calc(var(--g)*2) 'Reenie Beanie',cursive;overflow:hidden;z-index:3}
.ln{max-width:100%}.sp{height:calc(var(--g)*1.2);flex:none}
.ai{margin-left:var(--g);color:#FF5E7E;text-shadow:0 0 18px rgba(255,94,126,.35)}
.ai-line-container{display:inline-block;position:relative;max-width:100%;vertical-align:middle}
.ai-reenie-line{display:inline-block;font-family:'Reenie Beanie',cursive;font-size:calc(var(--g)*1.85);line-height:calc(var(--g)*1.95);white-space:nowrap;vertical-align:middle;background:linear-gradient(90deg,#FFA23A 0%,#FF5E7E 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 6px rgba(255,94,126,0.40))}
.ai-pen-tip-dot{position:absolute;display:none;width:7px;height:7px;border-radius:50%;background:#FFA23A;border:1.5px solid #FF5E7E;box-shadow:0 0 8px #FFA23A, 0 0 14px rgba(255,94,126,0.6);pointer-events:none;z-index:5;transform:translate(-50%,-50%)}
.math-line-svg{display:block;overflow:visible}
.math-stroke{fill:none;stroke:url(#ai-ink-grad);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(255,94,126,0.35))}
.pen-tip{fill:#FFA23A;stroke:#FF5E7E;stroke-width:1.5;filter:drop-shadow(0 0 6px #FFA23A);pointer-events:none}
.mk{pointer-events:auto;margin:calc(var(--g)*.5) 0 0 calc(var(--g)*1.5);font:inherit;color:#e8446a;opacity:0;transform:translateX(-8px);transition:.5s;visibility:hidden;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.mk.show{opacity:1;transform:none;visibility:visible}
.math-sup{font-size:.60em;vertical-align:.38em;line-height:0;display:inline-block;font-weight:400;margin-right:.14em;-webkit-text-fill-color:transparent}
.math-svg{display:inline-block;vertical-align:-0.32em;height:1.55em;width:auto;overflow:visible;fill:none;stroke:url(#ai-ink-grad);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;-webkit-text-fill-color:initial;filter:drop-shadow(0 0 6px rgba(255,94,126,0.40))}
.ai .math-svg{stroke:url(#ai-ink-grad)}
.math-diff{display:inline-block;margin-left:.22em}
#ring{position:absolute;border:2.5px solid var(--ac);border-radius:18px;opacity:0;transform:scale(1.04);transition:.4s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 24px color-mix(in srgb,var(--ac) 45%,transparent);pointer-events:none;z-index:4}
#ring.on{opacity:1;transform:none}
#confirm-panel{position:absolute;bottom:78px;left:50%;transform:translateX(-50%);width:min(460px,calc(100% - 32px));z-index:15;padding:16px;border-radius:20px;display:none;flex-direction:column;gap:10px;box-shadow:var(--sh)}
.cp-hdr{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em}
.cp-input{width:100%;border:1px solid var(--line);background:var(--line);border-radius:12px;padding:10px 14px;color:var(--tx);font:500 14px -apple-system,'Inter',sans-serif;outline:none;transition:border-color .2s}
.cp-input:focus{border-color:var(--ac)}
.cp-note{font-size:12px;color:#FF5E7E;line-height:1.35}
.cp-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:2px}
.cp-btn{border-radius:999px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:transform .12s,filter .2s}
.cp-btn:active{transform:scale(.97)}
.cp-btn.cancel{border:1px solid var(--line);color:var(--tx2);background:transparent}
.cp-btn.cancel:hover{background:var(--line);color:var(--tx)}
.cp-btn.solve{background:linear-gradient(90deg,#FFB347,#FF5E7E);color:#2a0f14}
.cp-btn.solve:hover{filter:brightness(1.06)}
#chip{position:absolute;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:999px;transition:.4s cubic-bezier(.2,.8,.2,1);white-space:nowrap;max-width:calc(100% - 24px);color:var(--tx);z-index:20}
#chip.on{opacity:1;transform:translate(-50%,0)}
.wv{display:flex;gap:3px;align-items:center;height:20px}
.wv i{width:3px;border-radius:2px;background:linear-gradient(#FFB347,#FF5E7E);height:5px;animation:wb .7s ease-in-out infinite alternate}
.wv i:nth-child(2){animation-delay:.15s}.wv i:nth-child(3){animation-delay:.3s}.wv i:nth-child(4){animation-delay:.1s}.wv i:nth-child(5){animation-delay:.25s}
@keyframes wb{to{height:20px}}
#toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;padding:10px 18px;border-radius:999px;transition:.35s;z-index:30;pointer-events:none;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
#scrim{display:none}
@media(max-width:820px){
:root{--g:28px}
#app{padding:8px;gap:8px;padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
#sb{position:fixed;left:8px;top:calc(8px + env(safe-area-inset-top,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:40;width:280px;transform:translateX(-110%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
#app.hide #sb{width:280px;padding:18px 14px 14px;opacity:1;border-width:1px;margin:0}
#app.open #sb{transform:none}
#app.open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:39}
.ttl{display:none}#hd{justify-content:space-between}
.tb{margin-left:auto}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="ai-ink-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="700" y2="0"><stop offset="0%" stop-color="#FFA23A"/><stop offset="100%" stop-color="#FF5E7E"/></linearGradient>
<symbol id="pen" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></symbol>
<symbol id="era" viewBox="0 0 24 24"><path d="M7 21l-4.3-4.3a2 2 0 010-2.8l9.6-9.6a2 2 0 012.8 0l5.6 5.6a2 2 0 010 2.8L13 21M22 21H7M5 11l9 9"/></symbol>
<symbol id="cir" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-dasharray="3 3" fill="none"/></symbol>
<symbol id="und" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3"/></symbol>
<symbol id="pls" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="sbr" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V6a1 1 0 011-1zM9 5v14"/></symbol>
<symbol id="sea" viewBox="0 0 24 24"><path d="M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-4.3-4.3"/></symbol>
<symbol id="vol" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></symbol>
<symbol id="spk" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>
<symbol id="set" viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6zM19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></symbol>
</defs></svg>
<div id="app">
<aside id="sb" class="glass" aria-label="Notebook sidebar">
<div class="brand"><span class="logo"><svg class="i"><use href="#pen"/></svg></span><b>Ink<i>Mentor</i></b></div>
<label class="sr"><svg class="i"><use href="#sea"/></svg><input id="q" placeholder="Search notes" aria-label="Search notes"></label>
<div class="lb">Calculus · Pages</div>
<div id="pl"></div>
<button id="add-page" aria-label="Add new page"><svg class="i"><use href="#pls"/></svg>+ New page</button>
<div class="mem"><i></i><span><b>Notebook memory</b><small id="mem-count">8 pages indexed</small></span></div>
<button class="st"><svg class="i"><use href="#set"/></svg>Settings</button>
</aside>
<div id="scrim"></div>
<main id="mn">
<header id="hd">
<button class="ib" id="menu" aria-label="Toggle sidebar"><svg class="i"><use href="#sbr"/></svg></button>
<div class="ttl"><b>Calculus</b><span id="pg"></span></div>
<div class="tb glass" role="toolbar" aria-label="Drawing tools">
<button class="ib on" data-t="pen" id="tool-pen" aria-label="Pen"><svg class="i"><use href="#pen"/></svg></button>
<button class="ib" data-t="era" id="tool-era" aria-label="Eraser"><svg class="i"><use href="#era"/></svg></button>
<button class="ib" data-t="circle" id="tool-circle" aria-label="Circle to solve"><svg class="i"><use href="#cir"/></svg></button>
<span class="dv"></span>
<button class="dot on" data-c="#111118" style="--c:#111118;background:#111118" aria-label="Black ink"></button>
<button class="dot" data-c="#7C5CFF" style="--c:#7C5CFF;background:#7C5CFF" aria-label="Violet ink"></button>
<button class="dot" data-c="#FF5E7E" style="--c:#FF5E7E;background:#FF5E7E" aria-label="Coral ink"></button>
<span class="dv"></span>
<button class="ib" id="undo" aria-label="Undo"><svg class="i"><use href="#und"/></svg></button>
<button class="ib on" id="vo" title="Voice narration (click to toggle, Shift+click to change language)" aria-label="Voice narration"><svg class="i"><use href="#vol"/></svg></button>
<button class="ib" id="hint-btn" title="Hint Ladder (Nudge → Step 1 → Solution)" aria-label="Hint Ladder"><svg class="i" viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-7 7c0 2.38 1.19 4.47 3 5.74V17a1 1 0 001 1h6a1 1 0 001-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 00-7-7zM9 21a1 1 0 001 1h4a1 1 0 001-1v-1H9v1z"/></svg></button>
<button class="sv" id="solve"><svg class="i"><use href="#spk"/></svg>Solve</button>
</div>
</header>
<section id="paper">
<canvas id="cv"></canvas>
<canvas id="ov"></canvas>
<div id="notes"></div>
<div id="ring"></div>
<div id="confirm-panel" class="glass" role="dialog" aria-label="Confirm recognized question">
  <div class="cp-hdr"><span id="cp-title">Confirm Question</span><span id="cp-status"></span></div>
  <input id="cp-text" class="cp-input" placeholder="Type your math question here..." autocomplete="off">
  <div id="cp-note" class="cp-note" style="display:none;"></div>
  <div class="cp-acts">
    <button id="cp-cancel" class="cp-btn cancel">Cancel</button>
    <button id="cp-hint" class="cp-btn" style="border:1px solid var(--line);background:var(--line);color:var(--tx);">Hint (3 levels)</button>
    <button id="cp-solve" class="cp-btn solve">Solve</button>
  </div>
</div>
<div id="chip" class="glass" role="status" aria-live="polite"><div class="wv"><i></i><i></i><i></i><i></i><i></i></div><span id="ct"></span></div>
</section>
</main>
</div>
<div id="toast" class="glass" role="status"></div>
<script>
// --- Core Elements & State ---
var $ = function(s) { return document.querySelector(s); };
var app = $('#app'), paper = $('#paper');
var cv = $('#cv'), cx = cv.getContext('2d');
var ov = $('#ov'), ox = ov.getContext('2d');
var notes = $('#notes'), ring = $('#ring');
var confirmPanel = $('#confirm-panel');

var SEEDED_PAGES = [
  { t: 'Chain rule', l: ['Chain rule', 'd/dx f(g(x)) = f′(g(x)) · g′(x)', 'e.g. d/dx (x²+1)³ = 6x(x²+1)²'] },
  { t: 'Product rule', l: ['Product rule', '(uv)′ = u′v + uv′'] },
  { t: 'Quotient rule', l: ['Quotient rule', '(u/v)′ = (u′v − uv′) / v²'] },
  { t: 'Trig derivatives', l: ['Trig derivatives', 'd/dx sin x = cos x', 'd/dx cos x = −sin x'] },
  { t: 'Implicit differentiation', l: ['Implicit differentiation', 'x² + y² = 25  →  2x + 2y·y′ = 0'] },
  { t: 'Limits', l: ['Limits', 'lim sin x / x = 1  as x → 0'] },
  { t: 'Integration basics', l: ['Integration basics', '∫ xⁿ dx = xⁿ⁺¹ / (n+1) + C'] },
  { t: 'Practice problems', q: 1 }
];

var pages = SEEDED_PAGES.slice();
var cur = 8;
var tool = 'pen'; // 'pen' | 'era' | 'circle'
var col = '#111118';
var busy = false;
var voice = true;
var filt = '';

// --- Voice Tuning Constants (Persona: Ink) ---
var VOICE_RATE = 1.0;
var VOICE_PITCH = 1.08;
window.VOICE_RATE = VOICE_RATE;
window.VOICE_PITCH = VOICE_PITCH;

// --- Handwriting & Typography Tuning Constants ---
var USE_STROKE_FONT = false; // Default: false (Reenie Beanie cursive). Set true for Hershey single-line stroke font.
window.USE_STROKE_FONT = USE_STROKE_FONT;

var AI_FONT_SIZE = 'calc(var(--g) * 1.85)';    // Main handwriting line font size
var INTEGRAL_SCALE = 1.55;                     // 1.4 to 1.6 times line font size
var INTEGRAL_STROKE_WIDTH = 2.4;              // Matched to Reenie Beanie stroke weight
var INTEGRAL_VERTICAL_ALIGN = '-0.28em';       // Vertically centered on text
var EXPONENT_SCALE = 0.60;                     // About 60% of font size
var EXPONENT_SHIFT = '0.38em';                 // Sits around top of base letter
var EXPONENT_RIGHT_GAP = '0.14em';             // Gap after exponent so it doesn't touch next char

function animateHersheyStrokeLine(lineObj, duration) {

      return;

      var len = items[k].path.getTotalLength();
      lengths.push(len);
      totalLen += len;
      items[k].path.style.strokeDasharray = len + ' ' + len;
      items[k].path.style.strokeDashoffset = len;
    }

      resolve();
      return;

    var animFrameId = null;
    var cancelled = false;

    var controller = {
      cancel: function() {
        cancelled = true;

        penTip.style.display = 'none';
        for (var n = 0; n < items.length; n++) {

        resolve();

      var progress = Math.min(1, elapsed / duration);
      var currentDist = progress * totalLen;

          items[j].path.style.strokeDashoffset = '0';
          accumulated += sLen;

          items[j].path.style.strokeDashoffset = (sLen - distOnStroke);

          var pt = items[j].path.getPointAtLength(distOnStroke);

        animFrameId = requestAnimationFrame(step);
      } else {

        resolve();

  });

function formatMathLine(raw) {

      } else if (match[2]) {

      } else if (match[3]) {

// --- Geometry Helpers for Distance & Stroke Intersection ---
function distToSegment(px, py, x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1;
  var l2 = dx * dx + dy * dy;
  if (l2 === 0) return Math.hypot(px - x1, py - y1);
  var t = ((px - x1) * dx + (py - y1) * dy) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function strokeHits(s, px, py, radius) {
  var pts = s.points;
  if (!pts || !pts.length) return false;
  var thresh = radius + ((s.width || 2.4) / 2);
  if (pts.length === 1) {
    return Math.hypot(pts[0].x - px, pts[0].y - py) <= thresh;
  }
  for (var i = 0; i < pts.length - 1; i++) {
    if (distToSegment(px, py, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y) <= thresh) {
      return true;
    }
  }
  return false;
}

function eraseAt(px, py) {

  var ERASE_RADIUS = 16;
  var remaining = list.filter(function(s) {

  if (remaining.length !== list.length) {
    setStrokes(cur, remaining);
    redoHistory[cur] = [];
    redraw();

}

// --- Stroke Rendering with Smooth Quadratic Curves ---
function renderStroke(s, targetCx) {
  var ctx = targetCx || cx;
  var p = s.points;
  if (!p || p.length === 0) return;
  ctx.save();
  ctx.strokeStyle = s.color || '#111118';
  ctx.fillStyle = s.color || '#111118';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = s.width || 2.4;

  if (p.length === 1) {
    ctx.beginPath();
    ctx.arc(p[0].x, p[0].y, (s.width || 2.4) / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return;
  }

  if (p.length === 2) {
    ctx.beginPath();
    ctx.moveTo(p[0].x, p[0].y);
    ctx.lineTo(p[1].x, p[1].y);
    ctx.stroke();
    ctx.restore();
    return;
  }

  ctx.beginPath();
  ctx.moveTo(p[0].x, p[0].y);
  for (var i = 1; i < p.length - 1; i++) {
    var midX = (p[i].x + p[i + 1].x) / 2;
    var midY = (p[i].y + p[i + 1].y) / 2;
    ctx.quadraticCurveTo(p[i].x, p[i].y, midX, midY);
  }
  ctx.lineTo(p[p.length - 1].x, p[p.length - 1].y);
  ctx.stroke();
  ctx.restore();
}

  };

  renderStroke(currentStroke);
});

cv.addEventListener('pointermove', function(e) {
  if (activePointerId === null || e.pointerId !== activePointerId) return;
  e.preventDefault();

  var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];

  if (tool === 'era') {
    for (var i = 0; i < evs.length; i++) {
      var p = getPt(evs[i]);
      eraseAt(p.x, p.y);
    }
    return;
  }

  if (tool === 'circle') {
    if (!loopPoints) return;
    for (var k = 0; k < evs.length; k++) {
      loopPoints.push(getPt(evs[k]));
    }
    drawLoopPreview();
    return;
  }

  if (!currentStroke) return;

  for (var j = 0; j < evs.length; j++) {
    currentStroke.points.push(getPt(evs[j]));
  }

  redraw();
});

function drawLoopPreview() {
  var r = paper.getBoundingClientRect();
  ox.clearRect(0, 0, r.width, r.height);
  if (!loopPoints || loopPoints.length < 2) return;
  ox.save();
  ox.strokeStyle = '#7C5CFF';
  ox.lineWidth = 2.4;
  ox.setLineDash([5, 4]);
  ox.beginPath();
  ox.moveTo(loopPoints[0].x, loopPoints[0].y);
  for (var i = 1; i < loopPoints.length; i++) {
    ox.lineTo(loopPoints[i].x, loopPoints[i].y);
  }
  ox.stroke();
  ox.restore();
}

function endStroke(e) {
  if (activePointerId === null || (e && e.pointerId !== activePointerId)) return;
  try {
    if (cv.hasPointerCapture && cv.hasPointerCapture(activePointerId)) {
      cv.releasePointerCapture(activePointerId);
    }
  } catch (err) {}
  activePointerId = null;

  if (tool === 'era') return;

  if (tool === 'circle') {
    var r = paper.getBoundingClientRect();
    ox.clearRect(0, 0, r.width, r.height);
    if (!loopPoints || loopPoints.length < 3) {
      loopPoints = null;
      return;
    }
    handleCircleGesture(loopPoints);
    loopPoints = null;
    return;
  }

  if (currentStroke && currentStroke.points.length > 0) {
    var list = getStrokes(cur);
    list.push(currentStroke);
    setStrokes(cur, list);
    redoHistory[cur] = [];
    currentStroke = null;
    redraw();
  }
}

var VOICE_LANGS = [
  { code: 'en-US', name: 'English' },
  { code: 'ta-IN', name: 'Tamil / Tanglish' },
  { code: 'hi-IN', name: 'Hindi' }
];
var voiceLangIdx = 0;

var cachedVoices = [];
function loadVoices() {
  if (typeof window !== 'undefined' && window.speechSynthesis) {
    cachedVoices = window.speechSynthesis.getVoices() || [];
  }
}
if (typeof window !== 'undefined' && window.speechSynthesis) {
  loadVoices();
  if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
}

var hasLoggedVoice = false;
function logVoiceOnce(v) {
  if (!hasLoggedVoice && v && v.name) {
    hasLoggedVoice = true;
    console.log(v.name);
  }
}

function pickBestVoice(targetLangCode) {
  if (!cachedVoices || !cachedVoices.length) {
    loadVoices();
  }
  var voices = cachedVoices;
  if (!voices || !voices.length) return null;

  var chosen = null;
  var langPrefix = (targetLangCode || 'en-US').split('-')[0].toLowerCase();
  if (langPrefix === 'en') {
    // 1. Prefer en-IN voice if present
    var enIn = voices.find(function(v) {
      return v.lang && v.lang.toLowerCase().replace('_', '-').startsWith('en-in');
    });
    if (enIn) chosen = enIn;

    // 2. Otherwise a voice whose name includes 'Natural', 'Google', or 'Neural'
    if (!chosen) {
      var premiumEn = voices.find(function(v) {
        if (!v.lang || !v.lang.toLowerCase().startsWith('en')) return false;
        var name = (v.name || '').toLowerCase();
        return name.includes('natural') || name.includes('google') || name.includes('neural');
      });
      if (premiumEn) chosen = premiumEn;
    }

    // 3. Otherwise any English voice
    if (!chosen) {
      var anyEn = voices.find(function(v) {
        return v.lang && v.lang.toLowerCase().startsWith('en');
      });
      if (anyEn) chosen = anyEn;
    }
  } else {
    var match = voices.find(function(v) {
      return v.lang && v.lang.toLowerCase().replace('_', '-').startsWith(langPrefix);
    });
    if (match) chosen = match;
  }

  if (chosen) logVoiceOnce(chosen);
  return chosen;
}

var activeSolveSeqId = 0;
var activeStepTimer = null;

function stopVoiceAndAnimation() {
  activeSolveSeqId++;
  if (activeStepTimer) {
    clearTimeout(activeStepTimer);
    activeStepTimer = null;
  }
  cancelActiveAnimation();
  if (typeof window !== 'undefined' && window.speechSynthesis) {
    try {
      window.speechSynthesis.cancel();
    } catch (e) {}
  }
  var chip = $('#chip');
  if (chip) chip.classList.remove('on');
  setBusy(false);
}

function interruptibleWait(ms, seqId) {
  return new Promise(function(resolve) {
    var t = setTimeout(function() {
      if (seqId !== undefined && seqId !== activeSolveSeqId) {
        resolve(false);
      } else {
        resolve(true);
      }
    }, ms);
    activeStepTimer = t;
  });
}

function speakNarration(text, estimatedDur, seqId) {
  return new Promise(function(resolve) {
    var clean = cleanNarrationText(text);
    var chip = $('#chip');
    var ct = $('#ct');
    if (ct) ct.textContent = clean;
    if (chip) chip.classList.add('on');

    if (!voice || typeof window === 'undefined' || !window.speechSynthesis) {
      var t = setTimeout(function() {
        resolve();
      }, estimatedDur || 2000);
      activeStepTimer = t;
      return;
    }

    var settled = false;
    var safetyTimer = null;

    function settle() {
      if (settled) return;
      settled = true;
      if (safetyTimer) {
        clearTimeout(safetyTimer);
        safetyTimer = null;
      }
      resolve();
    }

    try {
      var u = new SpeechSynthesisUtterance(clean);
      var curLang = VOICE_LANGS[voiceLangIdx] || { code: 'en-US' };
      u.lang = curLang.code;
      u.rate = VOICE_RATE;
      u.pitch = VOICE_PITCH;

      var chosenVoice = pickBestVoice(curLang.code);
      if (chosenVoice) u.voice = chosenVoice;

      u.onend = settle;
      u.onerror = settle;

      var safetyTimeoutMs = (estimatedDur || 2000) + 3000;
      safetyTimer = setTimeout(settle, safetyTimeoutMs);

      window.speechSynthesis.speak(u);
    } catch (err) {
      settle();
    }
  });
}

// --- Part B: Circle Gesture & Recognition ---
function handleCircleGesture(pts) {
  // Closed loop gesture check
  var totalLen = 0;
  for (var i = 0; i < pts.length - 1; i++) {
    totalLen += Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
  }
  var p0 = pts[0], pEnd = pts[pts.length - 1];
  var endDist = Math.hypot(pEnd.x - p0.x, pEnd.y - p0.y);

  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (var j = 0; j < pts.length; j++) {
    var p = pts[j];
    if (p.x < minX) minX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.x > maxX) maxX = p.x;
    if (p.y > maxY) maxY = p.y;
  }
  var w = maxX - minX, h = maxY - minY;
  var closeThresh = Math.max(30, totalLen * 0.15);
  var isClosed = (endDist <= closeThresh) && (w >= 40) && (h >= 40);

  if (!isClosed) {
    toast('Draw a closed circle around the question');
    say('Draw a closed circle around the question');
    return;
  }

  // Bounding box with 12px padding
  var pad = 12;
  var rPaper = paper.getBoundingClientRect();
  var box = {
    x: Math.max(0, minX - pad),
    y: Math.max(0, minY - pad),
    w: Math.min(rPaper.width, w + pad * 2),
    h: Math.min(rPaper.height, h + pad * 2)
  };
  currentCircleBox = box;

  // Position violet ring around the circled area
  ring.style.cssText = 'left:' + box.x + 'px;top:' + box.y + 'px;width:' + box.w + 'px;height:' + box.h + 'px';
  ring.classList.add('on');

  // Find student strokes that intersect the box
  var strokes = getStrokes(cur);
  var insideStrokes = strokes.filter(function(s) {
    if (!s.points || !s.points.length) return false;
    for (var k = 0; k < s.points.length; k++) {
      var pt = s.points[k];
      if (pt.x >= box.x && pt.x <= box.x + box.w && pt.y >= box.y && pt.y <= box.y + box.h) {
        return true;
      }
    }
    return false;
  });

  if (insideStrokes.length === 0) {
    ring.classList.remove('on');
    currentCircleBox = null;
    toast('Nothing written inside that circle');
    say('Nothing written inside that circle');
    return;
  }

  // Render ONLY student strokes inside box onto offscreen canvas (white bg, black ink)
  var offW = Math.max(1, Math.round(box.w));
  var offH = Math.max(1, Math.round(box.h));
  var offCv = document.createElement('canvas');
  offCv.width = offW;
  offCv.height = offH;
  var offCtx = offCv.getContext('2d');

  offCtx.fillStyle = '#ffffff';
  offCtx.fillRect(0, 0, offW, offH);

  offCtx.save();
  offCtx.translate(-box.x, -box.y);
  for (var m = 0; m < insideStrokes.length; m++) {
    var orig = insideStrokes[m];
    var blackStroke = {
      color: '#000000',
      width: Math.max(3, orig.width || 2.4),
      points: orig.points
    };
    renderStroke(blackStroke, offCtx);
  }
  offCtx.restore();

  // Scale so longest side is at most 1024px
  var longest = Math.max(offW, offH);
  var scale = longest > 1024 ? (1024 / longest) : 1;
  var finalCv = document.createElement('canvas');
  finalCv.width = Math.round(offW * scale);
  finalCv.height = Math.round(offH * scale);
  var finalCtx = finalCv.getContext('2d');
  finalCtx.fillStyle = '#ffffff';
  finalCtx.fillRect(0, 0, finalCv.width, finalCv.height);
  finalCtx.drawImage(offCv, 0, 0, finalCv.width, finalCv.height);

  var dataUrl = finalCv.toDataURL('image/png');
  var b64 = dataUrl.split(',')[1];

  sendRecognizeRequest(b64);
}

async function sendRecognizeRequest(b64) {
  setBusy(true);
  say('Reading your question…');

  var controller = new AbortController();
  var timer = setTimeout(function() { controller.abort(); }, 60000);

  try {
    var response = await fetch('/api/recognize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        image_base64: b64,
        media_type: 'image/png'
      }),
      signal: controller.signal
    });
    clearTimeout(timer);

    if (!response.ok) {
      var errData = await response.json().catch(function() { return {}; });
      var msg = errData.detail || ('Server status ' + response.status);
      toast('Recognition error: ' + msg);
      say('Could not read question automatically. Type it below.');
      showConfirmPanel('', 'Recognition error: ' + msg + '. Type question manually:');
      return;
    }

    var data = await response.json();
    if (data.readable === false) {
      say(data.note || 'Could not read handwriting. Type question below.');
      showConfirmPanel('', data.note || 'Handwriting not recognized. Type question manually:');
    } else {
      say('Question recognized. Confirm or edit to solve.');
      showConfirmPanel(data.question_text || data.latex || '', data.note || '');
    }
  } catch (err) {
    clearTimeout(timer);
    var isTimeout = err.name === 'AbortError';
    var errMsg = isTimeout ? 'Recognition timed out (60s)' : 'Backend unreachable (' + err.message + ')';
    toast(errMsg);
    say(errMsg + '. Type question below.');
    showConfirmPanel('', errMsg + '. Please type question manually:');
  } finally {
    setBusy(false);
  }
}

// --- Hint Ladder State & Handler ---
var hintCache = {};

async function runHintLadder(questionText, box) {
  if (busy) return;
  hideConfirmPanel();

  if (!hintCache[questionText]) {
    setBusy(true);
    say('Finding hint…');

    var contextPages = [];
    var cited = null;
    var citedTitle = null;

    try {
      var retResp = await fetch('/api/retrieve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: questionText, threshold: 0.65, top_k: 2 })
      });
      if (retResp.ok) {
        var retData = await retResp.json();
        if (retData.matches && retData.matches.length > 0) {
          var top = retData.top_match || retData.matches[0];
          cited = top.page;
          citedTitle = top.title;
          contextPages = retData.matches.map(function(m) {
            return { page: m.page, snippet: m.title + ': ' + m.snippet };
          });
        }
      }
    } catch (e) {}

    try {
      var sResp = await fetch('/api/solve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: questionText, context: contextPages })
      });
      var sData = await sResp.json();
      if (!sData.verified || !sData.steps || sData.steps.length === 0) {
        toast('Cannot generate hint: verification failed');
        setBusy(false);
        return;
      }
      var nudgeMsg = citedTitle
        ? ('Recall ' + citedTitle.toLowerCase() + ' from Page ' + cited + ' to break down this expression.')
        : (sData.steps[0].narration || 'Start by identifying the outer and inner functions.');

      hintCache[questionText] = {
        question: questionText,
        steps: sData.steps,
        cited: (sData.cites_pages && sData.cites_pages[0]) || cited,
        nudge: nudgeMsg,
        box: box,
        level: 0
      };
    } catch (err) {
      toast('Hint error: ' + err.message);
      setBusy(false);
      return;
    } finally {
      setBusy(false);
    }
  }

  var hData = hintCache[questionText];
  hData.level = (hData.level || 0) + 1;

  if (hData.level === 1) {
    var cleanNudge = cleanNarrationText(hData.nudge);
    toast('Hint 1/3 (Nudge): ' + cleanNudge);
    say(cleanNudge);
    var mkHtml = '<div class="ln" style="font-weight:600;font-size:calc(var(--g)*1.15);color:var(--tx2);margin-bottom:calc(var(--g)*0.3);">' + escapeHtml(questionText) + '</div><div class="sp"></div><div class="ln" style="font-size:calc(var(--g)*1.2);color:var(--tx2);font-style:italic;">💡 Nudge: ' + escapeHtml(cleanNudge) + '</div>';
    if (hData.cited) {
      mkHtml += '<button class="mk show" id="mk" data-p="' + hData.cited + '">← your Page ' + hData.cited + ', again</button>';
    }
    notes.innerHTML = mkHtml;
  } else if (hData.level === 2) {
    stopVoiceAndAnimation();
    var hintSeqId = activeSolveSeqId;
    var firstStep = hData.steps[0];
    var cleanFirstStep = cleanNarrationText(firstStep.narration);
    toast('Hint 2/3 (Next step): ' + firstStep.write);
    notes.innerHTML = '';
    var qH = document.createElement('div');
    qH.className = 'ln';
    qH.style.cssText = 'font-weight:600;font-size:calc(var(--g)*1.15);color:var(--tx2);margin-bottom:calc(var(--g)*0.3);';
    qH.textContent = questionText || '';
    notes.appendChild(qH);

    var spH = document.createElement('div');
    spH.className = 'sp';
    notes.appendChild(spH);

    var stepH = document.createElement('div');
    stepH.className = 'ln ai';
    stepH.id = 'step-0';
    var lineObj = buildLineSvg(firstStep.write);
    stepH.appendChild(lineObj.svg);
    notes.appendChild(stepH);

    if (hData.cited) {
      var mkH = document.createElement('button');
      mkH.className = 'mk show';
      mkH.id = 'mk';
      mkH.dataset.p = hData.cited;
      mkH.textContent = '← your Page ' + hData.cited + ', again';
      notes.appendChild(mkH);
    }

    var dur = getStepDuration(cleanFirstStep);
    var sPromise = speakNarration(cleanFirstStep, dur, hintSeqId);
    var dPromise = lineObj ? animateLineWriting(lineObj, dur) : Promise.resolve();
    await Promise.all([sPromise, dPromise]);
  } else {
    toast('Hint 3/3: Full solution');
    hData.level = 0;
    runSolvePipeline(questionText, box);
  }
}

// --- Solve Pipeline with Retrieval & Verification ---
async function runSolvePipeline(questionText, box) {
  stopVoiceAndAnimation();
  var currentSolveSeqId = activeSolveSeqId;
  setBusy(true);
  say('Searching notebook memory…');

  // Step 1: Memory index retrieval via /api/retrieve
  var contextPages = [];
  var cited = null;
  try {
    var retResp = await fetch('/api/retrieve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query: questionText,
        threshold: 0.65,
        top_k: 2
      })
    });
    if (retResp.ok) {
      var retData = await retResp.json();
      if (retData.matches && retData.matches.length > 0) {
        var top = retData.top_match || retData.matches[0];
        cited = top.page;
        say('Found ' + top.title.toLowerCase() + ' on Page ' + top.page);
        await interruptibleWait(1800, currentSolveSeqId);
        contextPages = retData.matches.map(function(m) {
          return {
            page: m.page,
            snippet: m.title + ': ' + m.snippet
          };
        });
      }
    }
  } catch (retErr) {
    console.warn('Memory retrieval skipped:', retErr);
  }

  if (currentSolveSeqId !== activeSolveSeqId) return;

  if (!cited) {
    say('Solving question…');
  }

  // Step 2: Solve with SymPy verification
  try {
    var response = await fetch('/api/solve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question: questionText,
        context: contextPages
      })
    });

    if (currentSolveSeqId !== activeSolveSeqId) return;

    if (!response.ok) {
      var errJson = await response.json().catch(function() { return {}; });
      throw new Error(errJson.detail || ('Server status ' + response.status));
    }

    var data = await response.json();

    if (!data.verified) {
      var failMsg = data.error || 'SymPy rejected answer';
      say('Verification check failed: ' + failMsg);
      toast('SymPy verification failed: ' + failMsg);
      showConfirmPanel(questionText, 'Verification failed: ' + failMsg + '. Adjust and retry:');
      await interruptibleWait(3000, currentSolveSeqId);
      $('#chip').classList.remove('on');
      return;
    }

    // Cited earlier page callback from verified solver response
    if (data.cites_pages && data.cites_pages.length > 0) {
      cited = data.cites_pages[0];
    }

    // Save AI output for the current page
    pageAiOutput[cur] = {
      question: questionText,
      steps: data.steps,
      cited: cited,
      box: box
    };
    savePersistedAiOutput();

    // Render real AI steps returned by backend onto the page
    notes.innerHTML = '';
    var qEl = document.createElement('div');
    qEl.className = 'ln';
    qEl.style.cssText = 'font-weight:600;font-size:calc(var(--g)*1.15);color:var(--tx2);margin-bottom:calc(var(--g)*0.3);';
    qEl.textContent = questionText || '';
    notes.appendChild(qEl);

    var spEl = document.createElement('div');
    spEl.className = 'sp';
    notes.appendChild(spEl);

    var stepLineObjs = [];
    data.steps.forEach(function(st, idx) {
      var stepEl = document.createElement('div');
      stepEl.className = 'ln ai';
      stepEl.id = 'step-' + idx;
      var lineObj = buildLineSvg(st.write);
      stepEl.appendChild(lineObj.svg);
      notes.appendChild(stepEl);
      stepLineObjs.push(lineObj);
    });

    if (cited) {
      var mkEl = document.createElement('button');
      mkEl.className = 'mk';
      mkEl.id = 'mk';
      mkEl.dataset.p = cited;
      mkEl.textContent = '← your Page ' + cited + ', again';
      notes.appendChild(mkEl);
    }

    // Animate each step with voice narration and real pen-stroke drawing
    for (var i = 0; i < data.steps.length; i++) {
      if (currentSolveSeqId !== activeSolveSeqId) return;

      var step = data.steps[i];
      var cleanText = cleanNarrationText(step.narration);
      var lineObj = stepLineObjs[i];
      var stepDuration = getStepDuration(cleanText);

      var speechPromise = speakNarration(cleanText, stepDuration, currentSolveSeqId);
      var drawPromise = lineObj ? animateLineWriting(lineObj, stepDuration) : Promise.resolve();

      await Promise.all([speechPromise, drawPromise]);

      if (currentSolveSeqId !== activeSolveSeqId) return;

      if (i < data.steps.length - 1) {
        await interruptibleWait(400, currentSolveSeqId);
      }
    }

    if (currentSolveSeqId !== activeSolveSeqId) return;
    say('Verified symbolically with SymPy');
    var mkBtn = $('#mk');
    if (mkBtn) mkBtn.classList.add('show');
    await interruptibleWait(2200, currentSolveSeqId);

  } catch (err) {
    if (currentSolveSeqId === activeSolveSeqId) {
      console.error('Solve error:', err);
      toast('API error: ' + err.message);
      say('Error solving problem: ' + err.message);
      showConfirmPanel(questionText, 'Error solving: ' + err.message);
      await interruptibleWait(2000, currentSolveSeqId);
    }
  } finally {
    if (currentSolveSeqId === activeSolveSeqId) {
      $('#chip').classList.remove('on');
      setBusy(false);
    }
  }
}

// Solve Button Click in Header
$('#solve').onclick = function() {
  if (busy) return;
  if (confirmPanel.style.display === 'flex') {
    $('#cp-solve').click();
    return;
  }
  if (cur === 8 && !currentCircleBox) {
    var qq = $('#qq');
    if (qq) {
      runSolvePipeline('Q3. Differentiate y = sin(3x²)', null);
      return;
    }
  }
  setTool('circle');
  toast('Circle a question');
  say('Circle a question on the page');
};

// Hint Button Click in Header
$('#hint-btn').onclick = function() {
  if (busy) return;
  if (confirmPanel.style.display === 'flex') {
    $('#cp-hint').click();
    return;
  }
  if (cur === 8) {
    runHintLadder('Q3. Differentiate y = sin(3x²)', null);
    return;
  }
  setTool('circle');
  toast('Circle a question for hints');
  say('Circle a question for hints');
};

// Scripted Demo Fallback (callable via console: window.runScriptedDemo())
window.runScriptedDemo = async function() {
  if (busy) return;
  go(8);
  await wait(300);
  var q = $('#qq');
  if (!q) return;
  var a = paper.getBoundingClientRect(), b = q.getBoundingClientRect();
  var box = {
    x: b.left - a.left - 14,
    y: b.top - a.top + 2,
    w: b.width + 28,
    h: b.height - 4
  };
  currentCircleBox = box;
  ring.style.cssText = 'left:' + box.x + 'px;top:' + box.y + 'px;width:' + box.w + 'px;height:' + box.h + 'px';
  ring.classList.add('on');
  runSolvePipeline('Differentiate y = sin(3x^2)', box);
};

if (innerWidth <= 820) app.classList.remove('open');
render();
size();
(document.fonts && document.fonts.ready || Promise.resolve()).then(function() {
  render();
  size();
});
</script>
